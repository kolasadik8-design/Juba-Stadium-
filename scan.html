<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUBA - GATE SCANNER</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-black text-white font-mono p-2">
<div class="max-w-md mx-auto bg-zinc-900 p-4 rounded-xl">
<h1 class="font-black text-center">GATE SCANNER - ANY GATE CAN SCAN</h1>
<div id="reader" class="my-3"></div>
<input id="manual" placeholder="Enter Ticket ID manually" class="w-full p-3 rounded bg-black border border-zinc-700 mb-2">
<button onclick="checkTicket(manual.value)" class="w-full bg-yellow-400 text-black font-black p-2 rounded">CHECK</button>
<div id="result" class="mt-4 p-4 rounded-xl bg-black text-center text-lg font-bold"></div>
<audio id="okSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
<audio id="badSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyB65erIbKPojeJCtvWCaUPNBqA_YQ6QGJ0",authDomain:"juba-stadium-1ace0.firebaseapp.com",projectId:"juba-stadium-1ace0"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
async function checkTicket(id){
 if(!id){return;} id=id.trim();
 const ref=db.collection('tickets').doc(id); const doc=await ref.get();
 const res=document.getElementById('result');
 if(!doc.exists){res.innerHTML=`❌ INVALID TICKET<br><span class="text-sm">Not found</span>`; res.className='mt-4 p-4 rounded-xl bg-red-900 text-center'; badSound.play(); return;}
 const t=doc.data();
 if(t.used){res.innerHTML=`⚠️ ALREADY USED<br><span class="text-sm">Used at ${t.checkedAt?.toDate().toLocaleString()} by ${t.checkedByGate}</span><br><br>Ticket: ${t.tier} ${t.block} ${t.row} ${t.seat}`; res.className='mt-4 p-4 rounded-xl bg-orange-900 text-center'; badSound.play(); return;}
 // VALID - Show direction
 res.innerHTML=`✅ VALID<br><span class="text-2xl">${t.tier}</span><br>${t.block} - ${t.row} - ${t.seat}<br><br><div class="bg-yellow-400 text-black p-2 rounded">DIRECT TO: ${t.assignedGate}</div><br><span class="text-xs">Customer: ${t.cName||'Guest'} | Event: ${t.eventType}</span><br><br><button onclick="markUsed('${id}')" class="bg-green-600 px-6 py-3 rounded-xl">CONFIRM ENTRY</button>`;
 res.className='mt-4 p-4 rounded-xl bg-green-900 text-center'; okSound.play();
}
async function markUsed(id){await db.collection('tickets').doc(id).update({used:true,checkedAt:firebase.firestore.FieldValue.serverTimestamp(),checkedByGate:'SCANNER'}); document.getElementById('result').innerHTML='✅ ENTRY CONFIRMED - WELCOME';}
const html5Qr=new Html5Qrcode("reader"); html5Qr.start({facingMode:"environment"},{fps:10,qrbox:250},(txt)=>{manual.value=txt; checkTicket(txt);});
</script>
</body>
</html>
