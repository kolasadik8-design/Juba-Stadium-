<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate Scanner - Juba Stadium</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{background:#070a14;color:#fff;font-family:system-ui;text-align:center;padding:20px} #reader{width:100%;max-width:400px;margin:auto;border-radius:16px;overflow:hidden}.ok{background:#16a34a;padding:16px;border-radius:12px;margin-top:16px}.bad{background:#dc2626;padding:16px;border-radius:12px;margin-top:16px}</style>
</head>
<body>
<h2>🎫 Gate Scanner</h2>
<p>وجه الكاميرا على QR حق التذكرة</p>
<div id="reader"></div>
<div id="result"></div>
<button onclick="startScan()" style="margin-top:20px;padding:12px 24px;background:#ffcc00;color:#000;border:0;border-radius:10px;font-weight:800">افتح الكاميرا</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB65erIbKPojeJCtvWCaUPNBqA_YQ6QGJ0",
  authDomain: "juba-stadium-1ace0.firebaseapp.com",
  projectId: "juba-stadium-1ace0",
  storageBucket: "juba-stadium-1ace0.firebasestorage.app",
  messagingSenderId: "299347484908",
  appId: "1:299347484908:web:926e359973c26aa1f0c5c9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let html5Qrcode;

window.startScan = () => {
  html5Qrcode = new Html5Qrcode("reader");
  html5Qrcode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
    async (decodedText) => {
      // decodedText = "JUBA-M123456|GATE 1|50000"
      const ticketId = decodedText.split('|')[0];
      document.getElementById('result').innerHTML = "جاري الفحص... " + ticketId;
      html5Qrcode.pause();

      const ref = doc(db, "juba_tickets", ticketId);
      const snap = await getDoc(ref);
      if(!snap.exists()){
        document.getElementById('result').innerHTML = `<div class="bad">❌ تذكرة غير موجودة: ${ticketId}</div>`;
      } else {
        const t = snap.data();
        if(t.used){
          document.getElementById('result').innerHTML = `<div class="bad">⚠️ مستخدمة من قبل! ${t.customer} - ${t.gate}<br>Time: ${t.usedAt?.toDate?.()||''}</div>`;
        } else {
          await updateDoc(ref, { used: true, usedAt: new Date() });
          document.getElementById('result').innerHTML = `<div class="ok">✅ صالحة - دخول مسموح<br><b>${t.customer}</b><br>${t.gate} - ${t.amount} SSP<br>${ticketId}</div>`;
        }
      }
      setTimeout(()=>{ document.getElementById('result').innerHTML=""; html5Qrcode.resume(); }, 3000);
    },
    (err) => {}
  );
}
</script>
</body>
</html>
