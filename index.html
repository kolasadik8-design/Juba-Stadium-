<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUBA STADIUM • SSFA V15.2 PRO - SECURE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>.stadium-bg{background-image:url('https://images.unsplash.com/photo-1489944440615-453fc2b6a9a9?q=80&w=1200');background-size:cover;background-position:center}.glass{background:rgba(10,16,32,0.93);backdrop-filter:blur(14px)}</style>
</head><body class="bg-[#050a18] text-white">

<div id="loginPage" class="min-h-screen stadium-bg relative flex items-center justify-center p-4">
<div class="absolute inset-0 bg-[#050a18]/85"></div>
<div class="relative w-full max-w-[380px] glass border-2 border-[#1e5bff]/40 rounded-[24px] p-7">
<div class="text-center mb-6"><div class="w-16 h-16 mx-auto bg-[#1e5bff] rounded-full flex items-center justify-center text-2xl mb-3">🏟️</div><h1 class="font-black text-xl">JUBA STADIUM • SSFA</h1><p class="text-xs opacity-60 mt-1">V15.2 PRO SECURE</p></div>
<input id="uid" placeholder="Username" class="w-full p-3.5 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] outline-none mb-3 text-sm"><input id="upass" type="password" placeholder="Password" class="w-full p-3.5 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] outline-none mb-5 text-sm"><button onclick="login()" class="w-full bg-[#1e5bff] p-3.5 rounded-xl font-black">Login Securely</button><p id="err" class="text-red-400 text-xs mt-3 text-center"></p>
</div>
</div>

<div id="mainApp" class="hidden relative"><div class="fixed inset-0 stadium-bg opacity-[0.06] pointer-events-none"></div><div class="relative">
<div class="bg-[#081028] border-b-2 border-[#1e5bff]/30 p-3 flex justify-between items-center sticky top-0 z-20"><div class="flex items-center gap-2"><div class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-[#1e5bff] font-black">JS</div><div class="font-black text-[15px]">JUBA STADIUM • SSFA</div><div class="bg-[#1e5bff] text-xs px-2.5 py-1 rounded-lg">🔒 V15.2</div></div><div class="text-[11px] opacity-60">developer</div></div>

<div class="max-w-[480px] mx-auto p-3 space-y-3 pb-24">
<div class="bg-[#0a1020] border border-white/10 rounded-[18px] p-3"><div class="flex flex-wrap gap-2 text-[11px] items-center"><span class="opacity-70">SHA-256 + HMAC OK</span><span class="bg-[#1e5bff] px-3 py-1 rounded-full font-bold">V15.2 VALID • SABAA MAIL</span><span class="border border-[#1e5bff] text-[#ffcc00] px-3 py-1 rounded-full font-bold">Total: <span id="totalSSP">0</span> SSP</span><button onclick="logout()" class="bg-[#c41c1c] px-4 py-1.5 rounded-full font-black ml-auto">Logout</button></div></div>

<div class="bg-gradient-to-br from-[#1e5bff] to-[#1239a3] rounded-[18px] p-5 text-center border border-white/10 shadow-[0_0_30px_rgba(30,91,255,0.4)]"><div class="text-[13px] opacity-90">إجمالي ناتج بيع كروت المباراة</div><div class="text-4xl font-black my-1"><span id="totalMain">0</span> SSP</div><div class="text-xs opacity-90">VIP: <span id="cVIP">0</span> | Second: <span id="cSEC">0</span> | Sabaa Mail: <span id="cMAIL">0</span> | Tickets: <span id="cTICK">0</span></div></div>

<div class="bg-[#0a1020] border-2 border-[#1e5bff]/50 rounded-[18px] p-4"><h2 class="font-black mb-3">⚽ Set Match + Prices (Dev Auth)</h2>
<div class="grid grid-cols-2 gap-2 mb-2"><input id="hteam" placeholder="Sudan" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] outline-none text-sm"><input id="ateam" placeholder="Eritrea" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] outline-none text-sm"></div>
<div class="grid grid-cols-2 gap-2 mb-2"><input id="edate" type="datetime-local" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] outline-none text-sm"><select id="comp" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] outline-none text-sm"><option>South Sudan Premier League</option><option>National Cup</option><option>Super Cup</option><option>First Division</option><option>Second Division</option><option>Women League</option><option>U20 League</option><option>U17 League</option><option>U15 League</option><option>AFCON Qualifiers</option><option>World Cup Qualifiers</option><option>CECAFA Cup</option><option>Friendly</option><option>U23 National</option><option>U20 National</option><option>U17 National</option><option>Women National</option></select></div>
<div class="grid grid-cols-2 gap-2 mb-2"><label class="p-2.5 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] text-[11px]">Home Logo<input type="file" accept="image/*" onchange="handleLogo(this,'home')" class="w-full mt-1 text-[10px]"><img id="homePrev" class="hidden w-10 h-10 mt-2 bg-white rounded p-1"></label><label class="p-2.5 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] text-[11px]">Away Logo<input type="file" accept="image/*" onchange="handleLogo(this,'away')" class="w-full mt-1 text-[10px]"><img id="awayPrev" class="hidden w-10 h-10 mt-2 bg-white rounded p-1"></label></div>
<div class="grid grid-cols-3 gap-2 mb-2"><input id="pVIP" type="number" value="50000" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] text-sm"><input id="pSEC" type="number" value="30000" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] text-sm"><input id="pTHIRD" type="number" value="10000" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] text-sm"></div>
<input id="devPass" type="password" placeholder="Confirm Developer Password" class="w-full p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] outline-none text-sm mb-3"><button onclick="saveMatchPro()" class="w-full bg-[#1e5bff] p-3.5 rounded-xl font-black">🔒 Save Securely</button><div class="bg-black/60 rounded-xl p-2.5 mt-3 text-[11px] opacity-60">Current: <span id="curMatch">-</span></div></div>

<div class="bg-[#0a1020] border border-[#1e5bff]/40 rounded-[18px] p-4"><div class="flex gap-2 mb-3"><input id="searchId" placeholder="Ticket ID / QR" class="flex-1 p-3 rounded-xl bg-black border border-white/10 text-xs"><button onclick="searchTicket()" class="bg-white/10 px-4 rounded-xl text-xs">🔍</button><button onclick="openScanner()" class="bg-[#1e5bff] px-4 rounded-xl text-xs">📷</button></div>
<div class="grid grid-cols-3 gap-2 mb-3"><button onclick="selectSec('vip')" class="p-3 rounded-xl bg-[#1e5bff] font-bold text-xs">VIP<br><span id="vipLeft">500</span></button><button onclick="selectSec('second')" class="p-3 rounded-xl bg-white/10 font-bold text-xs">SECOND<br><span id="secLeft">3000</span></button><button onclick="selectSec('third')" class="p-3 rounded-xl bg-white/5 font-bold text-xs">THIRD<br><span id="thirdLeft">2500</span></button></div><div id="seatBox" class="hidden"></div><div id="ticketResult" class="mt-4"></div><div id="liveTickets" class="mt-4 space-y-2 max-h-[350px] overflow-auto"></div></div>

<div class="bg-black border-2 border-[#1e5bff] rounded-[18px] p-4"><h2 class="font-black mb-3">👑 Admin Management</h2><div class="grid grid-cols-2 gap-2 mb-2"><input id="newUser" placeholder="New Username" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] text-sm"><input id="newPass" placeholder="New Password" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] text-sm"></div><div class="grid grid-cols-2 gap-2"><select id="newGate" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] text-sm"><option>juba</option><option>GATE 1</option><option>GATE 2</option><option>ALL</option></select><select id="newRole" class="p-3 rounded-xl bg-[#101a35] border-2 border-[#1e5bff] text-sm"><option>admin</option><option>ticketing</option></select></div><button onclick="createUser()" class="w-full mt-3 bg-white text-black p-3 rounded-xl font-black text-sm">Create User</button></div>
</div></div></div>

<script>
const cfg={apiKey:"AIzaSyAJeu6fPQuTd7kIBngbH7LxZnCKRQGXCk0",authDomain:"juba-stadium-247f3.firebaseapp.com",projectId:"juba-stadium-247f3"};
firebase.initializeApp(cfg); const db=firebase.firestore();
const CAP=10000; let logos={home:"",away:""}, selectedSec="vip", currentEvent=null, lastTicket=null, html5Qrcode=null, currentUser=null;

function handleLogo(input,type){
 const f=input.files[0]; if(!f) return; if(f.size>800000){alert('Max 800KB image');return;}
 const r=new FileReader(); r.onload=e=>{ logos[type]=e.target.result; document.getElementById(type+'Prev').src=e.target.result; document.getElementById(type+'Prev').classList.remove('hidden'); }; r.readAsDataURL(f);
}
async function login(){
 const id=document.getElementById('uid').value.trim(), pass=document.getElementById('upass').value.trim();
 if(!id||!pass){document.getElementById('err').innerText='Enter data';return;}
 const d=await db.collection('employees').doc(id).get();
 if(!d.exists || d.data().password!==pass || d.data().disabled){document.getElementById('err').innerText='Invalid or disabled';return;}
 currentUser={id,...d.data()};
 document.getElementById('loginPage').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden');
 load();
}
function logout(){ location.reload(); }

async function saveMatchPro(){
 if(document.getElementById('devPass').value!=='Admin@Juba2026!'){alert('Wrong dev password');return;}
 if(!logos.home||!logos.away){alert('Upload both logos from phone');return;}
 if(!document.getElementById('hteam').value.trim()||!document.getElementById('ateam').value.trim()){alert('Enter teams');return;}
 const id='EV-'+Date.now();
 await db.collection('events').doc(id).set({id,homeTeam:document.getElementById('hteam').value.trim(),awayTeam:document.getElementById('ateam').value.trim(),date:document.getElementById('edate').value,competition:document.getElementById('comp').value,homeLogo:logos.home,awayLogo:logos.away,prices:{vip:+document.getElementById('pVIP').value||50000,second:+document.getElementById('pSEC').value||30000,third:+document.getElementById('pTHIRD').value||10000},totalSeats:CAP,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
 alert('Saved Securely'); load();
}
async function load(){
 const ev=await db.collection('events').orderBy('createdAt','desc').limit(1).get();
 if(!ev.empty){currentEvent=ev.docs[0].data(); document.getElementById('curMatch').innerText=currentEvent.homeTeam+' vs '+currentEvent.awayTeam+' - '+currentEvent.date;}
 listen();
}
async function selectSec(s){
 if(!currentEvent){alert('Save match first');return;}
 selectedSec=s;
 const snap=await db.collection('tickets').where('eventId','==',currentEvent.id).where('section','==',s).get();
 let taken=new Set(snap.docs.map(d=>d.data().seatNumber));
 const totalSnap=await db.collection('tickets').where('eventId','==',currentEvent.id).get();
 if(totalSnap.size>=CAP){alert('STADIUM FULL 10,000');return;}
 document.getElementById('seatBox').classList.remove('hidden');
 document.getElementById('seatBox').innerHTML=`<div class="bg-black/60 p-3 rounded-xl mt-2 border border-white/5"><div class="flex justify-between text-xs mb-2"><span>${s.toUpperCase()} - Select Seat</span><span class="opacity-50">${taken.size} taken</span></div><div class="grid grid-cols-10 gap-1 max-h-[200px] overflow-auto">${Array.from({length:60},(_,i)=>{let n=i+1, t=taken.has(n); return `<button ${t?'disabled':`onclick="buy(${n})"`} class="h-8 text-xs rounded font-bold ${t?'bg-red-900/30 text-red-400 cursor-not-allowed':'bg-[#1e5bff]/30 hover:bg-[#1e5bff]'}">${n}</button>`}).join('')}</div><div class="flex gap-2 mt-3"><input id="cname" placeholder="Fan Name *" class="flex-1 p-2.5 bg-black border border-white/10 rounded-lg text-xs"><input id="cphone" placeholder="WhatsApp 211..." class="flex-1 p-2.5 bg-black border border-white/10 rounded-lg text-xs"></div></div>`;
 document.getElementById('seatBox').scrollIntoView({behavior:'smooth'});
}
async function buy(n){
 const name=document.getElementById('cname').value.trim(); if(name.length<2){alert('Enter valid name');return;}
 const phone=document.getElementById('cphone').value.trim().replace(/[^0-9]/g,'');
 const id=`${currentEvent.id}_${selectedSec}_${n}`; const ref=db.collection('tickets').doc(id);
 try{
  await db.runTransaction(async t=>{
   const ex=await t.get(ref); if(ex.exists) throw "Seat already taken - choose another";
   const all=await t.get(db.collection('tickets').where('eventId','==',currentEvent.id)); if(all.size>=CAP) throw "Stadium capacity 10,000 reached";
   const emp=await t.get(db.collection('employees').doc(currentUser.id)); if(!emp.exists||emp.data().disabled) throw "Account disabled";
   t.set(ref,{id,eventId:currentEvent.id,section:selectedSec,sectionName:selectedSec.toUpperCase(),seatNumber:n,customerName:name,customerPhone:phone,price:currentEvent.prices[selectedSec]||10000,soldBy:currentUser.id,gate:currentUser.gate||'ALL',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
  lastTicket={id,section:selectedSec,seatNumber:n,customerName:name,customerPhone:phone,price:currentEvent.prices[selectedSec]}; showTicket(lastTicket);
 }catch(e){alert("Failed: "+e);}
}
function showTicket(t){
 document.getElementById('ticketResult').innerHTML=`<div id="ticketCard" class="bg-white text-black rounded-[18px] p-4 text-center max-w-[320px] mx-auto shadow-2xl"><div class="flex justify-between items-center"><img src="${currentEvent.homeLogo}" class="w-10 h-10 object-contain bg-white rounded"><b class="text-xs">${currentEvent.homeTeam} vs ${currentEvent.awayTeam}</b><img src="${currentEvent.awayLogo}" class="w-10 h-10 object-contain bg-white rounded"></div><div class="my-3"><div class="text-[10px] tracking-widest opacity-50">${t.sectionName||selectedSec.toUpperCase()}</div><div class="text-5xl font-black">${t.seatNumber}</div><div class="text-[10px] opacity-60">${currentEvent.competition||''}</div></div><div class="flex justify-center"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(t.id)}" class="w-[120px] h-[120px] border-2 border-black p-1 rounded-lg"></div><div class="text-[9px] opacity-50 mt-2 break-all">${t.id}</div><div class="flex gap-2 mt-4"><button onclick="window.print()" class="flex-1 bg-black text-white p-2 rounded-lg text-xs font-bold">Print</button><button onclick="downloadPDF()" class="flex-1 bg-[#1e5bff] text-white p-2 rounded-lg text-xs font-bold">PDF</button><button onclick="sendWA()" class="flex-1 bg-[#25D366] text-black p-2 rounded-lg text-xs font-bold">WhatsApp</button></div></div>`;
}
async function downloadPDF(){ const el=document.getElementById('ticketCard'); if(!el){alert('No ticket');return;} const c=await html2canvas(el,{scale:3}); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm',[90,130]); pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,90,130); pdf.save((lastTicket.customerName||'ticket')+'.pdf'); }
function sendWA(){ if(!lastTicket||!lastTicket.customerPhone){alert('Enter WhatsApp number first');return;} window.open(`https://wa.me/${lastTicket.customerPhone}?text=${encodeURIComponent('🏟️ Juba Stadium Ticket\n'+currentEvent.homeTeam+' vs '+currentEvent.awayTeam+'\nSeat: '+lastTicket.seatNumber+'\nID: '+lastTicket.id)}`,'_blank'); }
async function searchTicket(){ let id=document.getElementById('searchId').value.trim(); if(!id){alert('Enter ID');return;} let d=await db.collection('tickets').doc(id).get(); if(!d.exists){alert('Ticket not found');return;} lastTicket=d.data(); showTicket(lastTicket); }
function openScanner(){
 document.getElementById('ticketResult').innerHTML=`<div class="bg-[#0a1020] p-3 rounded-xl border-2 border-[#1e5bff]"><div class="flex justify-between mb-2"><b class="text-xs">📷 Scan QR - Point camera</b><button onclick="closeScanner()" class="text-xs bg-white/10 px-3 py-1 rounded-full">✕ Close</button></div><div id="reader" style="width:100%"></div></div>`;
 html5Qrcode=new Html5Qrcode("reader");
 html5Qrcode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},(decoded)=>{closeScanner(); document.getElementById('searchId').value=decoded; searchTicket();},()=>{}).catch(err=>{alert("Camera needs HTTPS + permission: "+err);});
}
function closeScanner(){ if(html5Qrcode){ html5Qrcode.stop().then(()=>{ html5Qrcode.clear(); }).catch(()=>{}); html5Qrcode=null; } }
function listen(){
 if(!currentEvent) return;
 db.collection('tickets').where('eventId','==',currentEvent.id).onSnapshot(snap=>{
  let total=0, vip=0, sec=0, third=0; snap.forEach(d=>{const data=d.data(); total+=(data.price||0); if(data.section==='vip') vip++; else if(data.section==='second') sec++; else third++;});
  document.getElementById('totalSSP').innerText=total.toLocaleString(); document.getElementById('totalMain').innerText=total.toLocaleString(); document.getElementById('cVIP').innerText=vip; document.getElementById('cSEC').innerText=sec; document.getElementById('cMAIL').innerText=third; document.getElementById('cTICK').innerText=snap.size;
  document.getElementById('liveTickets').innerHTML=snap.docs.slice(0,80).map(d=>{let t=d.data(); return `<div class="flex justify-between bg-white/5 p-2.5 rounded-xl text-xs border border-white/5"><span>${t.sectionName} #${t.seatNumber} - ${t.customerName}</span><button onclick="delT('${t.id}')" class="text-red-400 font-bold">Del</button></div>`}).join('');
 });
}
async function delT(id){ if(!confirm('Delete permanently?')) return; const docu=await db.collection('tickets').doc(id).get(); if(!docu.exists) return; if(currentUser.role!=='admin' && docu.data().soldBy!==currentUser.id){alert('No permission - you can delete only your tickets');return;} await db.collection('tickets').doc(id).delete(); }
async function createUser(){
 const u=document.getElementById('newUser').value.trim(), p=document.getElementById('newPass').value.trim();
 if(u.length<3||p.length<4){alert('Username min 3, password min 4');return;}
 await db.collection('employees').doc(u).set({name:u,password:p,gate:document.getElementById('newGate').value,role:document.getElementById('newRole').value,disabled:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
 alert('User Created: '+u); document.getElementById('newUser').value=''; document.getElementById('newPass').value='';
}
</script></body></html>
