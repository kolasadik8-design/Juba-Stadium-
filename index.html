<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b1a">
<link rel="icon" href="icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JUBA STADIUM • SSFA V16.3</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#070b1a;--card:#111b3d;--text:#eaf0ff;--muted:#8aa0d0;--gold:linear-gradient(90deg,#FFD700,#FFA500)}
[data-theme="light"]{--bg:#f4f6ff;--card:#fff;--text:#0a1430}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Tajawal}
body{background:var(--bg);color:var(--text)} header{background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #ffffff15}
.card{background:var(--card);border:1px solid #ffffff12;border-radius:16px;padding:16px;margin:12px auto;max-width:900px}
.btn{border:none;padding:11px 14px;border-radius:10px;font-weight:900;cursor:pointer}.btn.primary{background:#2d6bff;color:#fff}.btn.ghost{background:transparent;border:1px solid #ffffff25;color:var(--text)}.btn.gold{background:var(--gold);color:#000}.btn.green{background:#00c853;color:#fff;width:100%;display:block;text-align:center;text-decoration:none;margin-top:8px}
input,select{width:100%;padding:11px;margin:6px 0;border-radius:10px;background:var(--bg);color:var(--text);border:1px solid #ffffff1f}
.match-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #ffffff15;border-radius:14px;margin:8px 0;cursor:pointer}.match-card img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}
.badge{background:#1a2a5a;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px}.ticket{border:2px dashed #FFD700;padding:18px;border-radius:16px;background:var(--card);text-align:center}.hidden{display:none!important}
.gold-text{background:var(--gold);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
#loginOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.login-box{max-width:400px;width:100%;background:var(--card);padding:24px;border-radius:20px;border:1px solid #ffffff15;text-align:center}
.call-btn{display:inline-flex;background:var(--gold);color:#000;padding:10px 16px;border-radius:20px;font-weight:900;text-decoration:none;cursor:pointer;margin-top:10px}
.upload-label{background:var(--bg);border:1px dashed #FFD700;padding:10px;border-radius:10px;cursor:pointer;text-align:center;flex:1;font-size:12px}
@media print{body *{visibility:hidden}.ticket,.ticket *{visibility:visible}.ticket{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<header><div style="font-weight:900">🏟️ JUBA STADIUM • V16.3</div><div><button class="btn ghost" id="themeBtn">🌙</button><button class="btn ghost" id="devBtn">المطور</button></div></header>
<div id="loginOverlay"><div class="login-box"><h2>دخول المطور</h2><p style="color:var(--muted);font-size:12px">SSFA • Juba Stadium Official</p><input id="devId" placeholder="ID"><input id="devPass" type="password" placeholder="Password"><button class="btn primary" id="loginDevBtn" style="width:100%;margin-top:8px">دخول</button><p id="loginMsg" style="color:#ff6b7a;font-size:12px"></p><a class="call-btn" id="callITBtn">📞 Call our IT team</a><p id="phoneReveal" class="hidden" style="margin-top:10px"><a href="tel:0928813308" style="color:#FFD700;font-weight:900;text-decoration:none">0928813308 - اضغط للاتصال</a></p></div></div>
<div class="card" id="publicView"><h3>المباريات القادمة</h3><div id="matchesList">Loading...</div><div id="ticketForm" class="hidden" style="margin-top:14px;border-top:1px solid #ffffff15;padding-top:12px"><h4 id="selTitle"></h4><select id="grade"><option value="VIP">الدرجة الأولى VIP - 20,000 SSP</option><option value="SECOND">الدرجة الثانية - 10,000 SSP</option><option value="THIRD">الدرجة الثالثة - 5,000 SSP</option><option value="SEVEN_MILE">مدرجات سبعة ميل - 2,000 SSP</option></select><input id="fanName" placeholder="اسم المشجع" maxlength="40"><input id="fanPhone" placeholder="واتساب 092xxxxxxx" maxlength="10"><p id="phoneError" style="color:#ff6b7a;font-size:11px;display:none">رقم غير صالح</p><button class="btn gold" id="cutBtn" style="width:100%">قطع التذكرة 🎫</button></div><div id="ticketResult" class="hidden"></div></div>
<div class="card hidden" id="devView"><h3>لوحة المطور - من ذاكرة الهاتف</h3><select id="compType"><option value="LOCAL">الدوري المحلي</option><option value="CAFCL">دوري أبطال أفريقيا</option><option value="AFCON">تصفيات أمم أفريقيا</option></select><input id="team1Name" placeholder="الفريق الأول" maxlength="30"><div style="display:flex;gap:8px;align-items:center"><label class="upload-label">📁 شعار 1<input type="file" id="team1File" accept="image/png,image/jpeg,image/webp" hidden></label><img id="prev1" style="width:44px;height:44px;border-radius:50%;display:none;background:#fff"></div><input id="team2Name" placeholder="الفريق الثاني" maxlength="30"><div style="display:flex;gap:8px;align-items:center"><label class="upload-label">📁 شعار 2<input type="file" id="team2File" accept="image/png,image/jpeg,image/webp" hidden></label><img id="prev2" style="width:44px;height:44px;border-radius:50%;display:none;background:#fff"></div><input id="matchDate" type="datetime-local"><button class="btn primary" id="addBtn" style="width:100%">حفظ المباراة ✅</button><div id="devList"></div><button class="btn ghost" id="backBtn" style="width:100%;margin-top:10px">رجوع</button></div>
<script>
// === الكونفق الجديد من صورتك - juba-stadium ===
const firebaseConfig = {
  apiKey: "AIzaSyDdf_94IqKuAqaJv2YaHnlabXydICevLo",
  authDomain: "juba-stadium.firebaseapp.com",
  projectId: "juba-stadium",
  storageBucket: "juba-stadium.firebasestorage.app",
  messagingSenderId: "959214976918",
  appId: "1:959214976918:web:08bcefd63d3f5607cf27b7",
  measurementId: "G-E9XLCERYDE"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
console.log("✅ Firebase Connected - Juba Stadium - NEW PROJECT");

// حماية
const esc=s=> (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const isValidPhone=p=> /^09\d{8}$/.test(p);
const isImageType=t=> ['image/png','image/jpeg','image/webp'].includes(t);
let allMatches=[], selectedId=null, devLogged=false, logo1='', logo2='';

document.getElementById('themeBtn').onclick=()=>{const c=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',c==='light'?'dark':'light');};
document.getElementById('callITBtn').onclick=e=>{e.preventDefault();document.getElementById('phoneReveal').classList.toggle('hidden');window.location.href='tel:0928813308';};
document.getElementById('loginDevBtn').onclick=()=>{const id=document.getElementById('devId').value.trim(), pass=document.getElementById('devPass').value; if((id==='ADMIN'&&pass==='Juba@2026')||(id==='SSFA'&&pass==='0928813308')){devLogged=true;document.getElementById('loginOverlay').style.display='none';loadMatches();}else document.getElementById('loginMsg').textContent='خطأ';};
document.getElementById('devBtn').onclick=()=>{if(!devLogged){document.getElementById('loginOverlay').style.display='flex';return;}document.getElementById('publicView').classList.add('hidden');document.getElementById('devView').classList.remove('hidden');loadDev();};
document.getElementById('backBtn').onclick=()=>{document.getElementById('devView').classList.add('hidden');document.getElementById('publicView').classList.remove('hidden');};

document.getElementById('team1File').onchange=e=>{const f=e.target.files[0]; if(!f||!isImageType(f.type)||f.size>400*1024) return alert('صورة غير صالحة >400KB'); const r=new FileReader(); r.onload=()=>{logo1=r.result;document.getElementById('prev1').src=r.result;document.getElementById('prev1').style.display='block';}; r.readAsDataURL(f);};
document.getElementById('team2File').onchange=e=>{const f=e.target.files[0]; if(!f||!isImageType(f.type)||f.size>400*1024) return alert('صورة غير صالحة'); const r=new FileReader(); r.onload=()=>{logo2=r.result;document.getElementById('prev2').src=r.result;document.getElementById('prev2').style.display='block';}; r.readAsDataURL(f);};

document.getElementById('addBtn').onclick=async()=>{const t1=document.getElementById('team1Name').value.trim(), t2=document.getElementById('team2Name').value.trim(), comp=document.getElementById('compType').value, date=document.getElementById('matchDate').value; if(!t1||!t2||!date||!logo1||!logo2) return alert('املأ البيانات + الشعارين من الهاتف'); await db.collection('juba_matches').add({team1:t1,team1Logo:logo1,team2:t2,team2Logo:logo2,competition:comp,date,created:Date.now()}); alert('تم ✅'); logo1='';logo2='';loadMatches();loadDev();};

async function loadMatches(){const snap=await db.collection('juba_matches').orderBy('created','desc').get(); allMatches=[]; snap.forEach(d=>allMatches.push({id:d.id,...d.data()})); let h=''; allMatches.forEach(m=>{h+=`<div class="match-card" onclick="selectMatch('${m.id}')"><img src="${m.team1Logo}"><div style="flex:1"><b>${esc(m.team1)} vs ${esc(m.team2)}</b><br><span class="badge">${esc(m.competition)}</span> <span style="font-size:11px">${esc(m.date)}</span></div><img src="${m.team2Logo}"></div>`;}); document.getElementById('matchesList').innerHTML=h||'لا يوجد';}
async function loadDev(){const snap=await db.collection('juba_matches').orderBy('created','desc').get(); let h=''; snap.forEach(d=>{h+=`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ffffff10"><span>${esc(d.data().team1)} vs ${esc(d.data().team2)}</span><button class="btn ghost" onclick="delMatch('${d.id}')">مسح</button></div>`;}); document.getElementById('devList').innerHTML=h;}
window.delMatch=async id=>{if(confirm('مسح؟')){await db.collection('juba_matches').doc(id).delete();loadMatches();loadDev();}};
window.selectMatch=id=>{selectedId=id; const m=allMatches.find(x=>x.id===id); document.getElementById('selTitle').textContent=m.team1+' vs '+m.team2; document.getElementById('ticketForm').classList.remove('hidden');};
document.getElementById('cutBtn').onclick=async()=>{const name=document.getElementById('fanName').value.trim(), phone=document.getElementById('fanPhone').value.trim(), grade=document.getElementById('grade').value; if(!isValidPhone(phone)){document.getElementById('phoneError').style.display='block';return;} document.getElementById('phoneError').style.display='none'; if(!name||!selectedId) return alert('املأ البيانات'); const m=allMatches.find(x=>x.id===selectedId); const tid='JUBA-'+Date.now().toString().slice(-8); const data={ticketId:tid,mId:selectedId,team1:m.team1,team2:m.team2,competition:m.competition,grade,date:m.date,fanName:esc(name),fanPhone:phone,created:Date.now(),used:false}; await db.collection('juba_tickets').doc(tid).set(data); showTicket(data,m);};
function showTicket(t,m){const waText=encodeURIComponent(`🏟️ تذكرتك - استاد جوبا\n${m.team1} vs ${m.team2}\n${t.grade}\nID:${t.ticketId}\n${m.date}`); const waLink=`https://wa.me/211${t.fanPhone.slice(1)}?text=${waText}`; const div=document.getElementById('ticketResult'); div.classList.remove('hidden'); div.innerHTML=`<div class="ticket"><h3 class="gold-text">JUBA STADIUM TICKET</h3><div style="display:flex;justify-content:center;gap:16px;margin:12px 0"><img src="${m.team1Logo}" style="width:60px;height:60px;background:#fff;border-radius:50%"><b>VS</b><img src="${m.team2Logo}" style="width:60px;height:60px;background:#fff;border-radius:50%"></div><h4>${esc(m.team1)} vs ${esc(m.team2)}</h4><p>${esc(m.competition)} - ${esc(m.date)}</p><p>${esc(t.grade)} | ${esc(t.fanName)}</p><div id="qrcode" style="display:flex;justify-content:center;margin:12px 0"></div><p style="font-size:11px">ID:${esc(t.ticketId)}</p><button class="btn gold" onclick="window.print()" style="width:100%">🖨️ طباعة</button><a href="${waLink}" target="_blank" class="btn green">💬 واتساب</a><a href="tel:0928813308" class="call-btn" style="width:100%;justify-content:center">📞 Call our IT team 0928813308</a></div>`; new QRCode(document.getElementById("qrcode"), {text:t.ticketId,width:150,height:150});}
loadMatches();
</script>
</body>
</html>
