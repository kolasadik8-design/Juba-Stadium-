<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUBA STADIUM - Ticketing</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-black text-white p-3 font-mono">
<div id="login" class="max-w-md mx-auto mt-16 bg-zinc-900 p-6 rounded-2xl">
<h1 class="text-2xl font-black text-center">JUBA STADIUM</h1><p class="text-center text-zinc-500 text-xs mb-6">TICKET SYSTEM v2 - Seat Lock</p>
<input id="uid" placeholder="ID e.g ADMIN" class="w-full p-3 rounded bg-black border border-zinc-700 mb-3">
<input id="pass" type="password" placeholder="Password" class="w-full p-3 rounded bg-black border border-zinc-700 mb-4">
<button onclick="doLogin()" class="w-full bg-yellow-400 text-black font-black p-3 rounded-xl">LOGIN</button>
<p id="msg" class="text-red-400 text-center mt-3"></p>
</div>

<div id="app" class="hidden max-w-6xl mx-auto">
<div class="flex justify-between bg-zinc-900 p-3 rounded-xl mb-3"><span><b id="uName"></b> | <span id="uGate" class="text-yellow-400"></span></span><button onclick="location.reload()" class="bg-zinc-800 px-3 py-1 rounded">Logout</button></div>

<div class="grid md:grid-cols-3 gap-3">
<div class="md:col-span-2 bg-zinc-900 p-4 rounded-xl">
<h2 class="font-bold mb-3">CUT TICKET - ONE SEAT PER TICKET</h2>
<div class="grid grid-cols-2 gap-2 mb-3">
<select id="tier" onchange="updatePrice()" class="p-3 rounded bg-black border border-zinc-700">
<option value="VIP">VIP - 30000 SSP</option>
<option value="FIRST CLASS">FIRST CLASS - 15000 SSP</option>
<option value="SECOND CLASS">SECOND CLASS - 7000 SSP</option>
<option value="SEVEN MILE">SEVEN MILE - 5000 SSP</option>
</select>
<select id="block" class="p-3 rounded bg-black border border-zinc-700"><option>BLOCK A</option><option>BLOCK B</option><option>BLOCK C</option><option>BLOCK D</option></select>
</div>
<div class="grid grid-cols-2 gap-2 mb-3">
<select id="row" class="p-3 rounded bg-black border border-zinc-700"><script>for(let i=1;i<=20;i++)document.write(`<option>ROW ${i}</option>`) </script></select>
<select id="seat" class="p-3 rounded bg-black border border-zinc-700"><script>for(let i=1;i<=30;i++)document.write(`<option>SEAT ${i}</option>`) </script></select>
</div>
<div class="grid grid-cols-2 gap-2 mb-3">
<input id="cName" placeholder="Customer Name (optional)" class="p-3 rounded bg-black border border-zinc-700">
<input id="cPhone" placeholder="WhatsApp 211..." class="p-3 rounded bg-black border border-zinc-700">
</div>
<div class="bg-black p-3 rounded mb-3 flex justify-between"><span>Seat ID:</span><b id="seatIdPreview" class="text-yellow-400">-</b><span>Price: <b id="pricePreview">30000</b> SSP</span></div>
<button onclick="cutTicket()" id="cutBtn" class="w-full bg-yellow-400 text-black font-black p-3 rounded-xl">CUT TICKET & PRINT</button>
<div id="qrcode" class="flex justify-center mt-3"></div><div id="tResult" class="mt-2 text-sm text-center"></div>
</div>
<div class="bg-zinc-900 p-4 rounded-xl"><h3 class="font-bold mb-2">Live Seats - <span id="liveGate"></span></h3><div id="ticketList" class="space-y-1 max-h-[500px] overflow-auto text-xs"></div></div>
</div>
<div id="adminPanel" class="hidden mt-3 bg-zinc-900 p-4 rounded-xl"><h2 class="font-black">ADMIN - ALL SALES</h2><div class="grid grid-cols-3 gap-2 my-3"><div class="bg-black p-3 rounded text-center"><div id="totalCount" class="text-xl font-black">0</div><div class="text-xs">Tickets</div></div><div class="bg-black p-3 rounded text-center"><div id="totalIncome" class="text-xl font-black text-yellow-400">0</div><div class="text-xs">SSP</div></div><div class="bg-black p-3 rounded text-center"><div id="dupBlock" class="text-xl font-black text-green-400">LOCKED</div><div class="text-xs">Seat Lock ON</div></div></div><div id="allTickets" class="text-xs space-y-1 max-h-[400px] overflow-auto"></div></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyB65erIbKPojeJCtvWCaUPNBqA_YQ6QGJ0",authDomain:"juba-stadium-1ace0.firebaseapp.com",projectId:"juba-stadium-1ace0"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let currentUser=null;
const prices={"VIP":30000,"FIRST CLASS":15000,"SECOND CLASS":7000,"SEVEN MILE":5000};

function updatePrice(){const t=document.getElementById('tier').value; document.getElementById('pricePreview').innerText=prices[t]; genSeatId();}
function genSeatId(){const tier=document.getElementById('tier').value, block=document.getElementById('block').value, row=document.getElementById('row').value, seat=document.getElementById('seat').value; const id=`${tier}_${block}_${row}_${seat}`.replace(/\s+/g,'_'); document.getElementById('seatIdPreview').innerText=id; return id;}
document.getElementById('tier').addEventListener('change',genSeatId); document.getElementById('block').addEventListener('change',genSeatId); document.getElementById('row').addEventListener('change',genSeatId); document.getElementById('seat').addEventListener('change',genSeatId); genSeatId();

async function doLogin(){
 const id=document.getElementById('uid').value.trim(), pw=document.getElementById('pass').value.trim();
 const doc=await db.collection('Juba_users').doc(id).get();
 if(!doc.exists){document.getElementById('msg').innerText='ID NOT FOUND';return;}
 if(doc.data().password!==pw){document.getElementById('msg').innerText='WRONG PASSWORD';return;}
 currentUser={id,...doc.data()}; document.getElementById('login').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
 document.getElementById('uName').innerText=currentUser.name; document.getElementById('uGate').innerText=currentUser.gate; document.getElementById('liveGate').innerText=currentUser.gate;
 if(currentUser.role==='admin') document.getElementById('adminPanel').classList.remove('hidden'); loadTickets();
}

async function cutTicket(){
 const btn=document.getElementById('cutBtn'); btn.disabled=true; btn.innerText='CHECKING...';
 const tier=document.getElementById('tier').value, block=document.getElementById('block').value, row=document.getElementById('row').value, seat=document.getElementById('seat').value;
 const seatId=genSeatId(); const price=prices[tier];
 const cName=document.getElementById('cName').value||'Guest', cPhone=document.getElementById('cPhone').value;
 try{
  await db.runTransaction(async (t)=>{
   const seatRef=db.collection('tickets').doc(seatId);
   const doc=await t.get(seatRef);
   if(doc.exists){throw new Error('SEAT ALREADY TAKEN - '+seatId);}
   t.set(seatRef,{ticketId:seatId,tier,block,row,seat,price,cName,cPhone,gate:currentUser.gate,soldBy:currentUser.id,soldByName:currentUser.name,createdAt:firebase.firestore.FieldValue.serverTimestamp(),used:false});
  });
  document.getElementById('qrcode').innerHTML=''; new QRCode(document.getElementById('qrcode'),{text:seatId,width:130,height:130});
  document.getElementById('tResult').innerHTML=`✅ SUCCESS: ${seatId}<br><button onclick="printPDF('${seatId}')" class="bg-white text-black px-3 py-1 rounded mt-2">PDF</button> <button onclick="sendWA('${cPhone}','${seatId}')" class="bg-green-600 px-3 py-1 rounded mt-2 ml-2">WhatsApp</button>`;
  loadTickets();
 }catch(e){document.getElementById('tResult').innerHTML=`<span class="text-red-400">❌ ${e.message}</span>`;}
 btn.disabled=false; btn.innerText='CUT TICKET & PRINT';
}
function printPDF(id){const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.text(`JUBA STADIUM`,20,20); doc.text(`Seat: ${id}`,20,30); doc.text(`Sold by: ${currentUser.name}`,20,40); doc.text(`Gate: ${currentUser.gate}`,20,50); doc.text(`${new Date().toLocaleString()}`,20,60); doc.save(id+'.pdf');}
function sendWA(phone,id){if(!phone){alert('Enter WhatsApp');return;}let p=phone.replace(/\D/g,''); if(p.startsWith('0'))p='211'+p.slice(1); const msg=`JUBA STADIUM\nSeat: ${id}\nGate: ${currentUser.gate}\nPresent QR at gate`; window.open(`https://wa.me/${p}?text=${encodeURIComponent(msg)}`,'_blank');}
async function loadTickets(){
 let q=db.collection('tickets').orderBy('createdAt','desc').limit(100); if(currentUser.gate!=='ALL') q=q.where('gate','==',currentUser.gate);
 const snap=await q.get(); let html='',count=0,income=0; snap.forEach(d=>{const x=d.data(); count++; income+=x.price||0; html+=`<div class="bg-black p-2 rounded flex justify-between"><span>${x.ticketId}</span><span>${x.price}</span></div>`;}); document.getElementById('ticketList').innerHTML=html||'No tickets';
 if(currentUser.role==='admin'){document.getElementById('totalCount').innerText=count; document.getElementById('totalIncome').innerText=income.toLocaleString(); document.getElementById('allTickets').innerHTML=html;}
}
</script>
</body>
</html>
