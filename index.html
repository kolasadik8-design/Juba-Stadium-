<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUBA INTERNATIONAL STADIUM - SECURE SSP</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter','Tajawal',system-ui}
body{margin:0;background:#080c1e;color:#fff;min-height:100vh}
header{background:linear-gradient(90deg,#0b3d91,#08163a);padding:18px;text-align:center;font-weight:800;font-size:20px;letter-spacing:1px;position:sticky;top:0;z-index:20;cursor:pointer;border-bottom:2px solid #f9d616}
header small{display:block;font-size:10px;opacity:.6;margin-top:4px}
.wrap{max-width:920px;margin:18px auto;padding:0 14px}
.card{background:linear-gradient(180deg,#151d36,#11182e);border:1px solid #243055;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.admin-card{background:linear-gradient(180deg,#fffbe0,#ffe77a);color:#111;border-radius:18px;padding:16px;display:none;border:2px dashed #c8a200}
.admin-card h3{margin:0 0 10px;color:#000}
.admin-card input{width:32%;padding:12px;border-radius:12px;border:1px solid #c9b86a;text-align:center;font-weight:800}
.admin-card button{width:100%;margin-top:12px;padding:14px;background:#111;border:0;border-radius:14px;color:#ffe77a;font-weight:800;font-size:16px}
.ticket-row{display:flex;gap:10px}
.ticket-row input,.ticket-row select{flex:1;padding:15px;border-radius:14px;border:1px solid #2a365f;background:#0e1530;color:#fff;font-size:15px}
.btn-primary{width:100%;padding:17px;background:linear-gradient(90deg,#2a6bff,#1746b0);border:0;border-radius:14px;color:#fff;font-weight:800;font-size:18px;margin-top:12px;cursor:pointer}
.team-logos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.logo-box{background:#fff;border-radius:14px;padding:10px;color:#000;text-align:center}
.logo-box img{width:100%;height:90px;object-fit:contain;margin-top:8px;border-radius:8px;background:#f5f5f5}
.tickets-list{background:#fff;color:#000;border-radius:18px;padding:14px;display:none;margin-top:16px}
table{width:100%;border-collapse:collapse}
th{background:#0b3d91;color:#fff;padding:10px;font-size:13px}
td{padding:10px;border-bottom:1px solid #eee;text-align:center;font-size:13px}
.del{background:#b91c1c;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
.hidden{display:none!important}
.qr-box{background:#fff;padding:12px;border-radius:12px;display:inline-block}
#summary{font-weight:800;color:#0b3d91}
</style>
</head>
<body>
<header id="secretHeader">JUBA INTERNATIONAL STADIUM<br>TICKETING SECURE SSP<small>اضغط 5 مرات للأدمن • 5 taps for admin</small></header>

<div class="wrap">
  <!-- ADMIN ONLY - مخفي -->
  <div id="adminSection" class="admin-card">
    <h3>🔒 Admin Only - تعديل الأسعار SSP</h3>
    <div style="display:flex;gap:8px">
      <input id="priceVIP" placeholder="VIP"><input id="priceA" placeholder="A"><input id="priceB" placeholder="B">
    </div>
    <button onclick="savePrices()">Save Prices ✓</button>
    <div class="team-logos">
      <div class="logo-box"><label>شعار الفريق 1</label><br><input type="file" id="logo1" accept="image/*" onchange="previewLogo(this,'prev1')"><img id="prev1"></div>
      <div class="logo-box"><label>شعار الفريق 2</label><br><input type="file" id="logo2" accept="image/*" onchange="previewLogo(this,'prev2')"><img id="prev2"></div>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 12px">🎟️ حجز تذكرة جديدة</h2>
    <div class="ticket-row"><input id="custName" placeholder="الاسم / Full Name"><input id="custPhone" placeholder="Phone / الهاتف"></div>
    <div class="ticket-row" style="margin-top:10px">
      <select id="ticketCat"><option value="50000">VIP - 50,000 SSP</option><option value="30000">Category A - 30,000 SSP</option><option value="20000">Category B - 20,000 SSP</option></select>
      <input id="ticketQty" type="number" value="1" min="1">
    </div>
    <button class="btn-primary" onclick="createTicket()">إصدار تذكرة + QR Code</button>
    <div id="qrResult" class="hidden" style="text-align:center;margin-top:18px">
      <div id="qrcode" class="qr-box"></div>
      <p id="newId" style="margin-top:10px;font-weight:800;font-size:16px;color:#f9d616"></p>
      <p style="font-size:12px;opacity:.7">احفظ الـ QR للدخول</p>
    </div>
  </div>

  <div id="ticketsWrap" class="tickets-list">
    <h3>📋 قائمة التذاكر - Admin View</h3>
    <p id="summary">0 tickets - 0 SSP</p>
    <input id="searchBox" placeholder="Search ID / Name / Phone" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:10px 0" oninput="filterTickets()">
    <table><thead><tr><th>ID</th><th>Name</th><th>Total</th><th>X</th></tr></thead><tbody id="ticketsBody"></tbody></table>
  </div>
</div>

<script>
// === CONFIG حقك نزلتو هنا ===
const firebaseConfig = { apiKey: "AIzaSyB65erIbKPojeJCtvWCaUPNBqA_YQ6QGJ0", authDomain: "juba-stadium-1ace0.firebaseapp.com", projectId: "juba-stadium-1ace0", storageBucket: "juba-stadium-1ace0.firebasestorage.app", messagingSenderId: "299347484908", appId: "1:299347484908:web:926e359973c26aa1f0c5c9" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// اظهار الادمن - 5 ضغطات او Ctrl+Shift+A
let clicks=0;
document.getElementById('secretHeader').onclick=()=>{ clicks++; if(clicks>=5){ showAdmin(); clicks=0; } setTimeout(()=>clicks=0,2500); }
document.addEventListener('keydown',e=>{ if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='a') showAdmin(); });

function showAdmin(){
  const pass=prompt("Admin Password:");
  if(pass==="5293" || pass==="admin" || pass==="SSNPS2024"){
    document.getElementById('adminSection').style.display='block';
    document.getElementById('ticketsWrap').style.display='block';
    loadPrices(); loadTickets();
    alert("Admin Mode ON - لوحة التحكم فتحت");
  } else if(pass!==null) alert("كلمة سر خطأ");
}

function savePrices(){
  db.collection('stadium_config').doc('prices').set({
    vip: document.getElementById('priceVIP').value,
    a: document.getElementById('priceA').value,
    b: document.getElementById('priceB').value,
    updated: Date.now()
  }).then(()=>alert("تم الحفظ ✓"));
}
function loadPrices(){
  db.collection('stadium_config').doc('prices').get().then(d=>{
    if(d.exists){ const p=d.data(); document.getElementById('priceVIP').value=p.vip||50000; document.getElementById('priceA').value=p.a||30000; document.getElementById('priceB').value=p.b||20000; updateCats(p); }
    else { priceVIP.value=50000; priceA.value=30000; priceB.value=20000; }
  });
}
function updateCats(p){
  document.getElementById('ticketCat').innerHTML=`<option value="${p.vip}">VIP - ${Number(p.vip).toLocaleString()} SSP</option><option value="${p.a}">Category A - ${Number(p.a).toLocaleString()} SSP</option><option value="${p.b}">Category B - ${Number(p.b).toLocaleString()} SSP</option>`;
}
function previewLogo(input,id){ if(input.files&&input.files[0]){ const r=new FileReader(); r.onload=e=>document.getElementById(id).src=e.target.result; r.readAsDataURL(input.files[0]); } }

function createTicket(){
  const name=document.getElementById('custName').value.trim();
  if(!name) return alert("اكتب الاسم");
  const phone=document.getElementById('custPhone').value.trim();
  const id="JUBA-M"+Date.now().toString().slice(-6)+Math.random().toString(36).substring(2,4).toUpperCase();
  const total=parseInt(document.getElementById('ticketCat').value)*parseInt(document.getElementById('ticketQty').value||1);
  db.collection('juba_tickets').doc(id).set({
    id, name, phone, cat: document.getElementById('ticketCat').options[document.getElementById('ticketCat').selectedIndex].text,
    total, qty: parseInt(document.getElementById('ticketQty').value||1), created: Date.now()
  }).then(()=>{
    document.getElementById('newId').textContent=id+" | "+total.toLocaleString()+" SSP";
    document.getElementById('qrResult').classList.remove('hidden');
    document.getElementById('qrcode').innerHTML="";
    new QRCode(document.getElementById('qrcode'),{text:id+" | "+name+" | "+total,width:180,height:180});
    document.getElementById('custName').value=""; document.getElementById('custPhone').value="";
    loadTickets();
  }).catch(e=>alert("خطأ فايربيس: "+e.message));
}

let allTickets=[];
function loadTickets(){
  db.collection('juba_tickets').orderBy('created','desc').onSnapshot(s=>{
    allTickets=[]; let sum=0;
    s.forEach(doc=>{ const d=doc.data(); allTickets.push(d); sum+=d.total||0; });
    document.getElementById('summary').textContent=`${allTickets.length} tickets - ${sum.toLocaleString()} SSP`;
    render(allTickets);
  });
}
function render(list){
  document.getElementById('ticketsBody').innerHTML=list.map(t=>`<tr><td>${t.id}</td><td>${t.name}</td><td>${(t.total||0).toLocaleString()}</td><td><button class="del" onclick="delTicket('${t.id}')">X</button></td></tr>`).join('');
}
function filterTickets(){
  const q=document.getElementById('searchBox').value.toLowerCase();
  render(allTickets.filter(t=>t.id.toLowerCase().includes(q)||t.name.toLowerCase().includes(q)||(t.phone||'').includes(q)));
}
function delTicket(id){ if(confirm("حذف التذكرة "+id+" ؟")) db.collection('juba_tickets').doc(id).delete(); }

loadPrices();
</script>
</body>
</html>
