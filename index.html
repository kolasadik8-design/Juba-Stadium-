<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juba Stadium - V18 Cashier System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{font-family:system-ui} .hidden{display:none}</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
<div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
<div class="bg-gray-800 p-8 rounded-2xl w-full max-w-md border border-gray-700">
<h1 class="text-2xl font-bold text-center mb-2">🏟️ استاد جوبا</h1>
<p class="text-center text-gray-400 mb-6 text-sm">V18 - نظام الموظفين المحمي</p>
<div id="lockMsg" class="hidden bg-red-900/50 p-3 rounded mb-4 text-sm text-center"></div>
<div id="loginAlert" class="hidden p-3 rounded mb-4 text-sm"></div>
<label class="text-sm">اسم المستخدم</label>
<input id="username" class="w-full p-3 rounded bg-gray-700 border border-gray-600 mb-4 text-left" dir="ltr" placeholder="ADMIN or employee">
<label class="text-sm">كلمة السر</label>
<input id="password" type="password" class="w-full p-3 rounded bg-gray-700 border border-gray-600 mb-4 text-left" dir="ltr" placeholder="••••••">
<button onclick="doLogin()" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded font-bold">دخول 🔐</button>
<p class="text-xs text-gray-500 mt-4 text-center">بعد 3 محاولات خاطئة - النظام يقفل 5 دقائق</p>
</div></div>

<div id="appPage" class="hidden">
<header class="bg-gray-800 p-4 flex justify-between items-center border-b border-gray-700">
<div><span id="userRoleBadge" class="text-xs bg-blue-600 px-2 py-1 rounded"></span> <span id="userNameDisplay" class="font-bold mr-2"></span></div>
<button onclick="logout()" class="bg-red-600 px-4 py-1 rounded text-sm">خروج</button>
</header>
<div class="p-4 max-w-6xl mx-auto">
<!-- Admin Panel -->
<div id="adminPanel" class="hidden">
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
<div class="bg-gray-800 p-4 rounded"><p class="text-xs text-gray-400">إجمالي دخل اليوم</p><p id="totalIncomeAll" class="text-2xl font-bold text-green-400">0 SDG</p></div>
<div class="bg-gray-800 p-4 rounded"><p class="text-xs text-gray-400">عدد التذاكر المباعة</p><p id="totalTicketsAll" class="text-2xl font-bold">0</p></div>
<div class="bg-gray-800 p-4 rounded"><p class="text-xs text-gray-400">عدد الموظفين</p><p id="totalEmployees" class="text-2xl font-bold">0</p></div>
</div>

<div class="bg-gray-800 p-4 rounded mb-6">
<h3 class="font-bold mb-3">➕ إنشاء حساب موظف جديد</h3>
<div class="grid grid-cols-1 md:grid-cols-4 gap-2">
<input id="newEmpName" placeholder="الاسم - مثال: Ahmed" class="p-2 rounded bg-gray-700">
<input id="newEmpUser" placeholder="يوزر - ahmed1" class="p-2 rounded bg-gray-700 text-left" dir="ltr">
<input id="newEmpPass" placeholder="باسورد - 1234" class="p-2 rounded bg-gray-700 text-left" dir="ltr">
<button onclick="createEmployee()" class="bg-blue-600 rounded p-2 font-bold">إنشاء</button>
</div></div>

<div id="employeesReport" class="bg-gray-800 p-4 rounded mb-6"></div>
<div id="matchesAdmin" class="bg-gray-800 p-4 rounded"></div>
</div>
<!-- End Admin Panel -->
  <!-- Employee Panel -->
<div id="employeePanel" class="hidden">
<div class="grid grid-cols-3 gap-3 mb-6">
<div class="bg-gray-800 p-3 rounded text-center"><p class="text-xs">VIP</p><p id="myVip" class="text-xl font-bold">0</p><p id="myVipIncome" class="text-xs text-green-400">0 SDG</p></div>
<div class="bg-gray-800 p-3 rounded text-center"><p class="text-xs">جانبية</p><p id="mySide" class="text-xl font-bold">0</p><p id="mySideIncome" class="text-xs text-green-400">0 SDG</p></div>
<div class="bg-gray-800 p-3 rounded text-center"><p class="text-xs">شعبية</p><p id="myPop" class="text-xl font-bold">0</p><p id="myPopIncome" class="text-xs text-green-400">0 SDG</p></div>
</div>
<div class="bg-blue-900/30 p-3 rounded mb-4 text-center"><p class="text-sm">إجمالي دخلي</p><p id="myTotalIncome" class="text-2xl font-bold text-green-400">0 SDG</p><p id="myTotalCount" class="text-xs">0 تذكرة</p></div>

<div id="matchesList" class="space-y-3"></div>
<div id="myTicketsList" class="mt-8 bg-gray-800 p-4 rounded"><h3 class="font-bold mb-3">🎟️ تذاكري التي قطعتها</h3><div id="myTickets"></div></div>
</div>
</div></div>

<!-- Ticket Modal -->
<div id="ticketModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
<div class="bg-white text-black p-6 rounded-2xl w-full max-w-sm text-center">
<div id="qrcode" class="flex justify-center mb-3"></div>
<p id="tInfo" class="text-sm"></p>
<button onclick="document.getElementById('ticketModal').classList.add('hidden')" class="mt-4 bg-gray-800 text-white px-6 py-2 rounded w-full">إغلاق</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ============ ضع الـ CONFIG حقك هنا ============
const firebaseConfig = {
  apiKey: "AIzaSyA...ضع_حقك_هنا",
  authDomain: "juba-stadium.firebaseapp.com",
  projectId: "juba-stadium",
  storageBucket: "juba-stadium.appspot.com",
  messagingSenderId: "123456",
  appId: "1:123:web:abc"
};
// لو ما عارف، انسخو من ملفك القديم أو من Firebase Console > Project Settings
// =============================================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;
const MAX_ATTEMPTS = 3; const LOCK_MS = 5*60*1000;

function isLocked(u){
  const k='lock_'+u; const d=JSON.parse(localStorage.getItem(k)||'{}');
  if(d.until && Date.now()<d.until) return {locked:true, remain:Math.ceil((d.until-Date.now())/1000)};
  return {locked:false};
}
function recordFail(u){
  const k='attempt_'+u; let c=parseInt(localStorage.getItem(k)||'0')+1;
  localStorage.setItem(k,c); if(c>=MAX_ATTEMPTS){
    localStorage.setItem('lock_'+u, JSON.stringify({until:Date.now()+LOCK_MS}));
    localStorage.removeItem(k);
  }
}
function clearFail(u){ localStorage.removeItem('attempt_'+u); localStorage.removeItem('lock_'+u); }

window.doLogin = async function(){
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value.trim();
  const alertBox=document.getElementById('loginAlert');
  const lockBox=document.getElementById('lockMsg');
  if(!u||!p){ alertBox.className='bg-yellow-900/50 p-3 rounded mb-4 text-sm text-center'; alertBox.textContent='اكتب اليوزر والباسورد'; alertBox.classList.remove('hidden'); return; }
  const lk=isLocked(u); if(lk.locked){ lockBox.textContent=`مقفول بسبب محاولات كتيرة - حاول بعد ${lk.remain} ثانية`; lockBox.classList.remove('hidden'); return; } else lockBox.classList.add('hidden');

  try{
    // جرب collection الصغيرة والكبيرة
    let userDoc=null; for(let col of ['juba_users','Juba_users']){
      let s=await getDoc(doc(db,col,u)); if(s.exists()){ userDoc=s.data(); break; }
      let q=query(collection(db,col), where("username","==",u)); let qs=await getDocs(q); if(!qs.empty){ userDoc=qs.docs[0].data(); break; }
    }
    if(!userDoc || userDoc.pass!==p){ recordFail(u); alertBox.className='bg-red-900/50 p-3 rounded mb-4 text-sm text-center'; alertBox.textContent=`يوزر أو باسورد غلط - محاولة ${localStorage.getItem('attempt_'+u)||1}/${MAX_ATTEMPTS}`; alertBox.classList.remove('hidden'); return; }
    clearFail(u); currentUser={id:u,...userDoc}; localStorage.setItem('juba_session',JSON.stringify(currentUser));
    showApp();
  }catch(e){ alertBox.textContent='خطأ: '+e.message; alertBox.classList.remove('hidden'); }
}

function showApp(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('userNameDisplay').textContent=currentUser.name||currentUser.username;
  document.getElementById('userRoleBadge').textContent=currentUser.role==='admin'?'المدير العام':'موظف';
  if(currentUser.role==='admin'){ document.getElementById('adminPanel').classList.remove('hidden'); loadAdmin(); }
  else { document.getElementById('employeePanel').classList.remove('hidden'); loadEmployee(); }
}
window.logout=function(){ localStorage.removeItem('juba_session'); location.reload(); }
  async function loadAdmin(){
  let users=await getDocs(collection(db,'Juba_users')); if(users.empty) users=await getDocs(collection(db,'juba_users'));
  document.getElementById('totalEmployees').textContent=users.size;
  let tickets=await getDocs(collection(db,'juba_tickets')); let allT=[...tickets.docs]; try{ let t2=await getDocs(collection(db,'juba_tickets')); }catch{}
  let total=0; let report={};
  allT.forEach(d=>{ let x=d.data(); total+=(x.price||0); let who=x.soldBy||'غير معروف'; if(!report[who]) report[who]={vip:0,side:0,pop:0,income:0,name:x.soldByName||who}; if(x.grade==='vip') report[who].vip++; else if(x.grade==='side') report[who].side++; else report[who].pop++; report[who].income+=(x.price||0); });
  document.getElementById('totalIncomeAll').textContent=total+' SDG'; document.getElementById('totalTicketsAll').textContent=allT.length;
  let html='<h3 class="font-bold mb-3">📊 تقرير الموظفين</h3><div class="space-y-2">'; Object.keys(report).forEach(k=>{ let r=report[k]; html+=`<div class="bg-gray-700 p-3 rounded flex justify-between text-sm"><div><b>${r.name}</b> (${k})<br><span class="text-xs">VIP:${r.vip} جانبية:${r.side} شعبية:${r.pop}</span></div><div class="text-left"><b class="text-green-400">${r.income} SDG</b><br><span class="text-xs">${r.vip+r.side+r.pop} تذكرة</span></div></div>`; }); html+='</div>'; document.getElementById('employeesReport').innerHTML=html;
  loadMatches(true);
}
async function loadEmployee(){ loadMatches(false); loadMyTickets(); }
async function loadMatches(isAdmin){
  let ms=await getDocs(query(collection(db,'juba_matches'), orderBy('createdAt','desc'))); if(ms.empty) ms=await getDocs(collection(db,'Juba_users'));
  let cont=document.getElementById(isAdmin?'matchesAdmin':'matchesList'); cont.innerHTML='<h3 class="font-bold mb-3">⚽ المباريات</h3>';
  // fallback if no matches collection
  try{ let snap=await getDocs(collection(db,'juba_matches')); if(snap.empty) snap=await getDocs(collection(db,'Juba_matches')); snap.forEach(d=>{ let m=d.data(); cont.innerHTML+=`<div class="bg-gray-700 p-3 rounded flex justify-between items-center mb-2"><div><b>${m.team1||m.home} vs ${m.team2||m.away}</b><br><span class="text-xs text-gray-400">${m.date||''}</span></div><button onclick="cutTicket('${d.id}',${m.vipPrice||1000},${m.sidePrice||500},${m.popPrice||200})" class="bg-green-600 px-3 py-1 rounded text-sm">قطع تذكرة</button></div>`; }); }catch{ cont.innerHTML+='<p class="text-xs text-gray-400">لا توجد مباريات - أنشئ من لوحة المدير القديمة gate.html</p>'; }
}
window.cutTicket=function(matchId,vipP,sideP,popP){
  let grade=prompt('اكتب الدرجة: vip / side / pop','pop'); if(!grade) return; let price=grade==='vip'?vipP:grade==='side'?sideP:popP;
  let buyer=prompt('اسم الجمهور؟'); if(!buyer) return;
  addDoc(collection(db,'juba_tickets'),{matchId,grade,price,buyerName:buyer,soldBy:currentUser.id||currentUser.username,soldByName:currentUser.name,createdAt:serverTimestamp(),used:false}).then(docRef=>{
    document.getElementById('qrcode').innerHTML=''; new QRCode(document.getElementById('qrcode'),{text:docRef.id,width:150,height:150});
    document.getElementById('tInfo').innerHTML=`<b>${buyer}</b><br>${grade.toUpperCase()} - ${price} SDG<br>بواسطة: ${currentUser.name}<br><small>${docRef.id}</small>`; document.getElementById('ticketModal').classList.remove('hidden'); if(currentUser.role!=='admin') loadMyTickets();
  });
}
async function loadMyTickets(){
  let q=query(collection(db,'juba_tickets'), where('soldBy','==',currentUser.id||currentUser.username)); let snap=await getDocs(q);
  let vip=0,side=0,pop=0,inc=0; let html='';
  snap.forEach(d=>{ let t=d.data(); inc+=t.price||0; if(t.grade==='vip') vip++; else if(t.grade==='side') side++; else pop++; html+=`<div class="bg-gray-700 p-2 rounded mb-1 text-xs flex justify-between"><span>${t.buyerName} - ${t.grade}</span><span class="text-green-400">${t.price} SDG</span></div>`; });
  document.getElementById('myVip').textContent=vip; document.getElementById('mySide').textContent=side; document.getElementById('myPop').textContent=pop;
  document.getElementById('myVipIncome').textContent=vip*1000+' SDG'; document.getElementById('myTotalIncome').textContent=inc+' SDG'; document.getElementById('myTotalCount').textContent=snap.size+' تذكرة';
  document.getElementById('myTickets').innerHTML=html||'لم تقطع أي تذكرة بعد';
}
window.createEmployee=async function(){
  let name=document.getElementById('newEmpName').value.trim(); let user=document.getElementById('newEmpUser').value.trim(); let pass=document.getElementById('newEmpPass').value.trim();
  if(!name||!user||!pass){ alert('املأ كل الحقول'); return; }
  try{ await setDoc(doc(db,'Juba_users',user),{username:user,pass:pass,role:'employee',name:name,createdAt:serverTimestamp()}); alert('تم إنشاء الموظف: '+name); document.getElementById('newEmpName').value=''; document.getElementById('newEmpUser').value=''; document.getElementById('newEmpPass').value=''; loadAdmin(); }catch(e){ alert('خطأ: '+e.message); }
}
// auto login
let sess=localStorage.getItem('juba_session'); if(sess){ try{ currentUser=JSON.parse(sess); showApp(); }catch{} }
</script>
</body>
</html>
