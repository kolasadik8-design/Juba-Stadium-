<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juba Stadium PRO - Secure</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head><body class="bg-[#080a12] text-white"><div id="app"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAJeu6fPQuTd7kIBngbH7LxZnCKRQGXCk0",authDomain:"juba-stadium-247f3.firebaseapp.com",projectId:"juba-stadium-247f3"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
const CAP=10000;
const SECTIONS={
 vip:{name:"VIP",cap:500,price:50000,color:"from-yellow-400 to-amber-600"},
 first:{name:"الدرجة الأولى",cap:1500,price:30000,color:"from-blue-500 to-blue-700"},
 second:{name:"الدرجة الثانية",cap:3000,price:20000,color:"from-green-500 to-emerald-700"},
 third:{name:"الدرجة الثالثة",cap:2500,price:10000,color:"from-zinc-500 to-zinc-700"},
 seven:{name:"سبعة ميل",cap:2500,price:5000,color:"from-orange-500 to-red-600"}
};
let currentUser=null,currentEvent=null,selectedSec=null,lastTicket=null,html5QrcodeScanner=null;

function renderLogin(){
 document.getElementById('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-[#151821] p-8 rounded-[20px] w-full max-w-sm border border-white/10"><h1 class="text-3xl font-black text-center">🏟️ JUBA</h1><p class="text-center opacity-50 text-xs mb-6">PRO Secure v2</p><input id="uid" placeholder="ID" class="w-full p-3.5 rounded-xl bg-black border border-white/10 mb-3 outline-none"><input id="upass" type="password" placeholder="Password" class="w-full p-3.5 rounded-xl bg-black border border-white/10 mb-5 outline-none"><button onclick="login()" class="w-full bg-[#2b5cff] p-3.5 rounded-xl font-black">دخول</button><p id="err" class="text-red-400 mt-3 text-sm text-center"></p></div></div>`;
}
async function login(){
 const id=document.getElementById('uid').value.trim(), pass=document.getElementById('upass').value.trim();
 const d=await db.collection('employees').doc(id).get();
 if(!d.exists || d.data().password!==pass || d.data().disabled){document.getElementById('err').innerText='بيانات خطأ أو حساب موقوف';return;}
 currentUser={id,...d.data()}; loadEvent();
}
async function loadEvent(){
 const ev=await db.collection('events').orderBy('createdAt','desc').limit(1).get();
 if(ev.empty){ if(currentUser.role==='admin') renderAdmin(); else document.getElementById('app').innerHTML='<div class="p-10 text-center">لا توجد مباراة</div>'; return;}
 currentEvent=ev.docs[0].data(); renderMain();
}
function renderMain(){
 let secs=Object.entries(SECTIONS).map(([k,v])=>`<button onclick="selectSec('${k}')" class="p-4 rounded-2xl bg-gradient-to-br ${v.color} text-left"><div class="font-black">${v.name}</div><div class="text-xs opacity-80">${v.cap} • ${v.price.toLocaleString()} SSP</div></button>`).join('');
 document.getElementById('app').innerHTML=`
 <div class="max-w-6xl mx-auto p-4">
  <div class="bg-[#151821] p-4 rounded-2xl border border-white/10 mb-6">
   <div class="flex flex-wrap gap-3 justify-between items-center mb-4">
    <div class="flex items-center gap-3"><img src="${currentEvent.homeLogo||''}" class="w-10 h-10 rounded-full bg-white object-contain" onerror="this.src='https://via.placeholder.com/40'"><div><div class="font-black text-sm">${currentEvent.homeTeam} vs ${currentEvent.awayTeam}</div><div class="text-xs opacity-60">${currentEvent.date} • المباع <span id="soldCount">...</span> / ${CAP}</div></div><img src="${currentEvent.awayLogo||''}" class="w-10 h-10 rounded-full bg-white object-contain" onerror="this.src='https://via.placeholder.com/40'"></div>
    <div class="flex gap-2 flex-wrap">
     <div class="flex bg-black rounded-xl border border-white/10 overflow-hidden"><input id="searchId" placeholder="رقم التذكرة" class="bg-transparent p-2 px-3 outline-none w-[140px] text-sm"><button onclick="searchTicket()" class="bg-white/10 px-3 text-sm">🔍</button></div>
     <button onclick="openScanner()" class="bg-[#2b5cff] px-4 py-2 rounded-xl text-sm font-bold">📷 مسح QR</button>
     ${currentUser.role==='admin'?`<button onclick="renderAdmin()" class="bg-white/5 px-3 py-2 rounded-xl text-sm">⚙️</button>`:''}
    </div>
   </div>
   <div class="grid grid-cols-2 md:grid-cols-5 gap-3">${secs}</div>
  </div>
  <div id="seatBox" class="hidden bg-[#151821] p-5 rounded-2xl border border-white/10 mb-6"></div>
  <div id="ticketResult"></div>
  <div class="mt-8"><div class="flex justify-between mb-3"><h3 class="font-bold">📋 التذاكر المباشرة</h3><input id="searchT" oninput="filterTickets()" placeholder="بحث بالاسم..." class="bg-black border border-white/10 rounded-lg px-3 py-1 text-sm w-40"></div><div id="liveTickets" class="space-y-2"></div></div>
 </div>`; listenLive(); countSold();
}
async function countSold(){ const s=await db.collection('tickets').where('eventId','==',currentEvent.id).get(); let el=document.getElementById('soldCount'); if(el) el.innerText=s.size; }

async function selectSec(k){
 selectedSec=k; const s=SECTIONS[k];
 const snap=await db.collection('tickets').where('eventId','==',currentEvent.id).where('section','==',k).get();
 let taken=new Set(snap.docs.map(d=>d.data().seatNumber));
 const total=(await db.collection('tickets').where('eventId','==',currentEvent.id).get()).size;
 if(total>=CAP){alert('⛔ الاستاد اكتمل 10,000');return;}
 document.getElementById('seatBox').classList.remove('hidden');
 document.getElementById('seatBox').innerHTML=`
  <h2 class="font-black mb-3">${s.name} - اختار مقعد</h2>
  <div class="grid grid-cols-12 md:grid-cols-20 gap-1.5 max-h-[260px] overflow-auto p-2 bg-black/30 rounded-xl">
  ${Array.from({length:s.cap},(_,i)=>{let n=i+1, isT=taken.has(n); return `<button ${isT?'disabled':`onclick="buy(${n})"`} class="h-8 text-[11px] rounded font-bold ${isT?'bg-red-900/30 text-red-400':'bg-white/10 hover:bg-[#2b5cff]'}">${n}</button>`}).join('')}
  </div>
  <div class="grid md:grid-cols-3 gap-3 mt-4"><input id="cname" placeholder="اسم المشجع *" class="p-3 bg-black rounded-xl border border-white/10"><input id="cphone" placeholder="واتساب 2119xxxx" class="p-3 bg-black rounded-xl border border-white/10"><div class="bg-black p-3 rounded-xl text-center border border-white/10 font-bold">${s.price.toLocaleString()} SSP</div></div>`;
}
async function buy(seatNum){
 const name=document.getElementById('cname').value.trim(); const phone=document.getElementById('cphone').value.trim().replace(/[^0-9]/g,'');
 if(!name){alert('اكتب الاسم');return;}
 const s=SECTIONS[selectedSec]; const ticketId=`${currentEvent.id}_${selectedSec}_${seatNum}`;
 const ref=db.collection('tickets').doc(ticketId);
 try{
  await db.runTransaction(async t=>{
   const ex=await t.get(ref); if(ex.exists) throw "المقعد محجوز مسبقا";
   const all=await db.collection('tickets').where('eventId','==',currentEvent.id).get(); if(all.size>=CAP) throw "السعة اكتملت";
   t.set(ref,{id:ticketId,eventId:currentEvent.id,section:selectedSec,sectionName:s.name,seatNumber:seatNum,customerName:name,customerPhone:phone,price:s.price,soldBy:currentUser.id,gate:currentUser.gate,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
  lastTicket={id:ticketId,section:selectedSec,seatNumber:seatNum,customerName:name,customerPhone:phone,price:s.price,sectionName:s.name};
  showTicket(lastTicket); countSold();
 }catch(e){alert("فشل: "+e);}
}
function showTicket(t){
 const s=SECTIONS[t.section];
 document.getElementById('ticketResult').innerHTML=`
 <div id="ticketCard" class="bg-white text-black p-0 rounded-[20px] max-w-[380px] mx-auto overflow-hidden shadow-2xl border-[6px] border-white">
  <div class="bg-gradient-to-r ${s.color} p-4 text-white flex justify-between items-center">
   <img src="${currentEvent.homeLogo}" class="w-12 h-12 bg-white rounded-full object-contain p-1" onerror="this.style.display='none'"><div class="text-center"><div class="font-black text-sm">${currentEvent.homeTeam} VS ${currentEvent.awayTeam}</div><div class="text-[10px] opacity-80">${currentEvent.date}</div></div><img src="${currentEvent.awayLogo}" class="w-12 h-12 bg-white rounded-full object-contain p-1" onerror="this.style.display='none'">
  </div>
  <div class="p-5 text-center"><div class="text-[11px] tracking-[0.3em] opacity-60">${t.sectionName.toUpperCase()}</div><div class="text-5xl font-black my-1">${t.seatNumber}</div><div class="text-xs opacity-60">SEAT NO</div>
   <div class="mt-4 flex justify-between text-left bg-zinc-100 p-3 rounded-xl"><div><div class="text-[10px] opacity-60">المشجع</div><div class="font-bold text-sm">${t.customerName}</div></div><div class="text-right"><div class="text-[10px] opacity-60">السعر</div><div class="font-black">${t.price.toLocaleString()} SSP</div></div></div>
   <div class="flex justify-center mt-4 gap-4"><div id="qr"></div><div class="text-left text-[10px] leading-4"><div>Gate: ${currentUser.gate}</div><div>Sold: ${currentUser.id}</div><div>ID: ${t.id.slice(-12)}</div></div></div>
  </div>
 </div>
 <div class="flex gap-2 justify-center mt-4 max-w-[380px] mx-auto"><button onclick="window.print()" class="flex-1 bg-white text-black p-3 rounded-xl font-bold">🖨️ طباعة</button><button onclick="downloadPDF()" class="flex-1 bg-[#2b5cff] p-3 rounded-xl font-bold">📄 PDF</button><button onclick="sendWhatsApp()" class="flex-1 bg-[#25D366] p-3 rounded-xl font-bold">💬 واتساب</button></div>`;
 setTimeout(()=>{ new QRCode(document.getElementById("qr"),{text:t.id,width:90,height:90}); },400);
}
async function downloadPDF(){ const el=document.getElementById('ticketCard'); const canvas=await html2canvas(el,{scale:3}); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a6'); pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,105,148); pdf.save(`${lastTicket.customerName}_${lastTicket.seatNumber}.pdf`); }
function sendWhatsApp(){ if(!lastTicket.customerPhone){alert('اكتب رقم واتساب');return;} const msg=`🏟️ Juba Stadium\nتذكرتك: ${currentEvent.homeTeam} vs ${currentEvent.awayTeam}\nالدرجة: ${lastTicket.sectionName}\nالمقعد: ${lastTicket.seatNumber}\nID: ${lastTicket.id}`; window.open(`https://wa.me/${lastTicket.customerPhone}?text=${encodeURIComponent(msg)}`,'_blank'); }

async function searchTicket(){
 let id=document.getElementById('searchId').value.trim(); if(!id){alert('اكتب رقم التذكرة');return;}
 let docu=await db.collection('tickets').doc(id).get();
 if(!docu.exists){ alert('التذكرة غير موجودة - جرب الـ ID كامل'); return; }
 showFoundTicket(docu.data());
}
function showFoundTicket(t){
 document.getElementById('ticketResult').innerHTML=`
 <div class="bg-[#151821] border border-white/10 p-5 rounded-2xl max-w-md mx-auto">
  <div class="flex justify-between mb-4"><h2 class="font-black">تفاصيل التذكرة</h2><span class="text-xs px-2 py-1 rounded bg-green-500/20 text-green-400">${t.sectionName} - ${t.seatNumber}</span></div>
  <div class="space-y-2 text-sm"><div class="flex justify-between"><span class="opacity-60">المباراة</span><span>${currentEvent.homeTeam} vs ${currentEvent.awayTeam}</span></div><div class="flex justify-between"><span class="opacity-60">المشجع</span><b>${t.customerName}</b></div><div class="flex justify-between"><span class="opacity-60">تلفون</span><span>${t.customerPhone||'-'}</span></div><div class="flex justify-between"><span class="opacity-60">السعر</span><b>${t.price} SSP</b></div><div class="flex justify-between"><span class="opacity-60">البائع</span><span>${t.soldBy}</span></div><div class="text-[10px] opacity-40 break-all mt-2">ID: ${t.id}</div></div>
  <div class="flex gap-2 mt-5"><button onclick="delTicket('${t.id}')" class="flex-1 bg-red-600/20 text-red-400 border border-red-500/30 p-3 rounded-xl font-bold">🗑️ حذف</button><button onclick="document.getElementById('ticketResult').innerHTML=''" class="flex-1 bg-white/10 p-3 rounded-xl">إغلاق</button></div>
 </div>`;
}
function openScanner(){
 document.getElementById('ticketResult').innerHTML=`<div class="bg-[#151821] p-4 rounded-2xl max-w-md mx-auto border border-white/10"><div class="flex justify-between mb-3"><h3 class="font-bold">📷 مسح QR</h3><button onclick="closeScanner()" class="text-xs bg-white/10 px-3 py-1 rounded">✕</button></div><div id="reader" class="rounded-xl overflow-hidden"></div></div>`;
 html5QrcodeScanner=new Html5Qrcode("reader");
 html5QrcodeScanner.start({facingMode:"environment"},{fps:10,qrbox:250},(txt)=>{closeScanner(); document.getElementById('searchId').value=txt; searchTicket();},()=>{}).catch(e=>alert('الكاميرا فشلت: '+e));
}
function closeScanner(){ if(html5QrcodeScanner){ html5QrcodeScanner.stop().then(()=>html5QrcodeScanner.clear()); html5QrcodeScanner=null; } }

function listenLive(){
 db.collection('tickets').where('eventId','==',currentEvent.id).orderBy('createdAt','desc').limit(80).onSnapshot(snap=>{
  document.getElementById('liveTickets').innerHTML=snap.docs.map(d=>{ let t=d.data(); return `<div class="ticket-row flex justify-between items-center bg-[#151821] p-3 rounded-xl border border-white/5 text-sm" data-name="${t.customerName.toLowerCase()}"><div><span class="px-2 py-1 rounded bg-white/10 text-xs">${t.sectionName}</span> #${t.seatNumber} - <b>${t.customerName}</b></div><div class="flex gap-2"><button onclick="searchTicketById('${t.id}')" class="text-blue-400 text-xs">عرض</button><button onclick="delTicket('${t.id}')" class="text-red-400 text-xs">حذف</button></div></div>`; }).join('');
 });
}
function searchTicketById(id){ document.getElementById('searchId').value=id; searchTicket(); }
function filterTickets(){ let q=document.getElementById('searchT').value.toLowerCase(); document.querySelectorAll('.ticket-row').forEach(r=>{ r.style.display=r.dataset.name.includes(q)?'flex':'none'; }); }
async function delTicket(id){
 if(!confirm('حذف نهائي؟')) return;
 let docu=await db.collection('tickets').doc(id).get(); if(!docu.exists) return;
 if(currentUser.role!=='admin' && docu.data().soldBy!==currentUser.id){alert('ما عندك صلاحية');return;}
 await db.collection('tickets').doc(id).delete(); document.getElementById('ticketResult').innerHTML='<div class="text-center p-4 bg-green-500/10 rounded-xl text-green-400">✅ تم الحذف</div>'; countSold();
}
function renderAdmin(){
 document.getElementById('app').innerHTML=`<div class="p-6 max-w-2xl mx-auto"><h1 class="text-2xl font-black mb-6">لوحة الادمن</h1><div class="bg-[#151821] p-5 rounded-2xl space-y-3 border border-white/10"><input id="hteam" placeholder="المضيف" class="w-full p-3 bg-black rounded-xl border border-white/10"><input id="hlogo" placeholder="رابط شعار المضيف" class="w-full p-3 bg-black rounded-xl border border-white/10"><input id="ateam" placeholder="الضيف" class="w-full p-3 bg-black rounded-xl border border-white/10"><input id="alogo" placeholder="رابط شعار الضيف" class="w-full p-3 bg-black rounded-xl border border-white/10"><input id="edate" type="date" class="w-full p-3 bg-black rounded-xl border border-white/10"><button onclick="saveEvent()" class="w-full bg-[#2b5cff] p-3 rounded-xl font-black">💾 نشر</button></div><button onclick="loadEvent()" class="mt-6 w-full bg-white/10 p-3 rounded-xl">رجوع</button></div>`;
}
async function saveEvent(){ const id='EV-'+Date.now(); await db.collection('events').doc(id).set({id,homeTeam:document.getElementById('hteam').value,awayTeam:document.getElementById('ateam').value,homeLogo:document.getElementById('hlogo').value,awayLogo:document.getElementById('alogo').value,date:document.getElementById('edate').value,totalSeats:CAP,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); alert('تم'); loadEvent(); }
renderLogin();
</script><style>@media print{body *{visibility:hidden}#ticketCard,#ticketCard *{visibility:visible}#ticketCard{position:fixed;left:0;top:0;width:100%}}</style></body></html>
