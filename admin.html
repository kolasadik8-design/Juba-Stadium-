<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juba Stadium - Admin Panel</title>
<style>body{font-family:system-ui;background:#070a14;color:#fff;padding:20px;max-width:800px;margin:auto}input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #1f2742;background:#12172a;color:#fff}button{padding:10px 18px;border-radius:8px;border:0;font-weight:700;cursor:pointer}.btn-green{background:#16a34a;color:#fff}.btn-red{background:#dc2626;color:#fff}.card{background:#12172a;border:1px solid #1f2742;border-radius:12px;padding:14px;margin-top:12px}</style>
</head>
<body>
<h2>🏟️ Juba Stadium Admin</h2>

<div class="card">
<h3>Add New Match</h3>
<input id="homeTeam" placeholder="Home Team e.g Jamus">
<input id="awayTeam" placeholder="Away Team e.g Elmerehk">
<input id="date" type="date">
<input id="totalSeats" type="number" placeholder="Total Seats e.g 2400">
<div style="display:flex;gap:8px">
<input id="homeQuota" type="number" placeholder="Home % 40">
<input id="awayQuota" type="number" placeholder="Away % 30">
<input id="fedQuota" type="number" placeholder="Fed % 30">
</div>
<button class="btn-green" onclick="addEvent()">Add Match</button>
<p id="addLog"></p>
</div>

<div class="card">
<h3>All Matches / Events</h3>
<div id="eventsList">Loading...</div>
</div>

<div class="card">
<h3>All Tickets (with delete)</h3>
<div id="ticketsList">Loading...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB65erIbKPojeJCtvWCaUPNBqA_YQ6QGJ0",
  authDomain: "juba-stadium-1ace0.firebaseapp.com",
  projectId: "juba-stadium-1ace0",
  storageBucket: "juba-stadium-1ace0.firebasestorage.app",
  messagingSenderId: "299347484908",
  appId: "1:299347484908:web:926e359973c26aa1f0c5c9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addEvent = async () => {
  const homeTeam = document.getElementById('homeTeam').value.trim();
  const awayTeam = document.getElementById('awayTeam').value.trim();
  const date = document.getElementById('date').value;
  const totalSeats = parseInt(document.getElementById('totalSeats').value);
  const homeQuota = parseInt(document.getElementById('homeQuota').value);
  const awayQuota = parseInt(document.getElementById('awayQuota').value);
  const fedQuota = parseInt(document.getElementById('fedQuota').value);

  if(!homeTeam || !awayTeam || !date) return alert("Fill all fields");
  if(homeQuota+awayQuota+fedQuota !== 100) return alert("Quotas must sum to 100");

  await addDoc(collection(db, "events"), {
    id: "EV-" + Date.now(),
    type: "South Sudan Premier League",
    homeTeam, awayTeam, date,
    homeQuota, awayQuota, fedQuota,
    totalSeats, homeLogo:"", awayLogo:"", leagueLogo:"",
    createdAt: new Date()
  });
  document.getElementById('addLog').textContent = "✅ Added: " + homeTeam + " vs " + awayTeam;
  loadEvents();
}

async function loadEvents(){
  const snap = await getDocs(collection(db, "events"));
  let html = "";
  snap.forEach(d=>{
    const ev = d.data();
    // only show correct casing
    if(!ev.homeTeam) return;
    html += `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:8px 0">
      <div><b>${ev.homeTeam} vs ${ev.awayTeam}</b><br><small>${ev.date} • ${ev.totalSeats} seats</small></div>
      <button class="btn-red" onclick="deleteEvent('${d.id}')">Delete</button>
    </div>`;
  });
  document.getElementById('eventsList').innerHTML = html || "No events";
}
window.deleteEvent = async (id) => {
  if(!confirm("Delete this match?")) return;
  await deleteDoc(doc(db, "events", id));
  loadEvents();
}

async function loadTickets(){
  const snap = await getDocs(collection(db, "juba_tickets"));
  let html = "";
  snap.forEach(d=>{
    const t = d.data();
    html += `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:8px 0">
      <div><b>${t.id}</b> - ${t.customer||''} - ${t.gate||''}<br><small>${(t.amount||0).toLocaleString()} SSP</small></div>
      <button class="btn-red" onclick="deleteTicket('${d.id}')">Delete</button>
    </div>`;
  });
  document.getElementById('ticketsList').innerHTML = html || "No tickets";
}
window.deleteTicket = async (id) => {
  if(!confirm("Delete this ticket?")) return;
  await deleteDoc(doc(db, "juba_tickets", id));
  loadTickets();
}

loadEvents();
loadTickets();
</script>
</body>
</html>
