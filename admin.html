<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Matches</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>body{background:#070a14;color:#fff;font-family:system-ui;padding:20px}input{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #1f2742;background:#0d1226;color:#fff}button{width:100%;padding:12px;margin-top:12px;border-radius:10px;border:0;background:#1e5bff;color:#fff;font-weight:800}</style>
</head><body>
<h2>Add Match</h2>
<input id="home" placeholder="Home Team"><input id="away" placeholder="Away Team"><input id="date" type="date"><input id="type" placeholder="Type e.g Premier League"><input id="seats" placeholder="Total Seats e.g 2400" type="number">
<button onclick="add()">Add Match</button><div id="list" style="margin-top:20px"></div>
<script>
const cfg={apiKey:"AIzaSyAJeu6fPQuTd7kIBngbH7LxZnCKRQGXCk0",authDomain:"juba-stadium-247f3.firebaseapp.com",projectId:"juba-stadium-247f3",storageBucket:"juba-stadium-247f3.firebasestorage.app",messagingSenderId:"314725857339",appId:"1:314725857339:web:79885c6c7bddb21997841e"};
firebase.initializeApp(cfg);const db=firebase.firestore();
function add(){
 const id="EV-"+Date.now();
 db.collection('events').doc(id).set({id,homeTeam:home.value,awayTeam:away.value,date:date.value,type:type.value,totalSeats:parseInt(seats.value)||2400,homeQuota:40,awayQuota:30,fedQuota:30,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{alert("Added "+id); load();});
}
function load(){db.collection('events').orderBy('createdAt','desc').onSnapshot(s=>{let h="";s.forEach(d=>{const e=d.data();h+=`<div style="background:#12172a;padding:10px;margin-top:8px;border-radius:8px">${e.homeTeam} vs ${e.awayTeam} - ${e.date}</div>`});document.getElementById('list').innerHTML=h;});}
load();
</script></body></html>
