<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0033a0"><title>GATE - JUBA Stadium</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./logo.png"><style>body{margin:0;font-family:system-ui;background:#111;color:#fff}.top{background:#0033a0;padding:10px;display:flex;justify-content:space-between;align-items:center}.card{background:#222;border-radius:14px;padding:14px;margin:10px}.input{width:100%;padding:12px;border-radius:10px;border:none;margin:6px 0;font-size:16px}button{padding:12px;border:none;border-radius:10px;font-weight:900;cursor:pointer;width:100%;margin:4px 0}.valid{background:#078930;color:#fff;font-size:22px;padding:20px;border-radius:14px;text-align:center}.invalid{background:#c41e3a;color:#fff;font-size:22px;padding:20px;border-radius:14px;text-align:center}.hidden{display:none!important}.login{max-width:360px;margin:60px auto;background:#222;padding:20px;border-radius:20px;text-align:center}</style></head><body>
<div class="top"><b>🚪 GATE SCANNER V15.3</b><span id="who"></span><button onclick="logout()" style="width:auto;background:#a00;padding:5px 10px">Logout</button></div>
<div id="loginBox" class="login"><img src="./logo.png" width="80" style="border-radius:50%;background:#fff;padding:3px"><h3>JUBA GATE</h3><input id="lu" class="input" placeholder="Username"><input id="lp" class="input" type="password" placeholder="Password"><button style="background:#0033a0;color:#fff" onclick="doLogin()">Login</button><p id="lmsg" style="color:#f66"></p></div>
<div id="app" class="hidden" style="max-width:500px;margin:auto"><div class="card"><b>Scan Ticket</b><input id="scanId" class="input" placeholder="Enter Ticket ID or Scan QR" oninput="check()"><button style="background:#d4af37;color:#000" onclick="check()">🔍 CHECK TICKET</button><div id="result" style="margin-top:12px"></div><button id="allowBtn" class="hidden" style="background:#078930" onclick="allow()">✅ ALLOW ENTRY</button></div><div class="card" style="font-size:11px"><b>Today Stats</b><div id="stats"></div><button onclick="renderStats()" style="background:#444;margin-top:8px">Refresh Stats</button></div></div>
<script>
const PEPPER='SSFA-PEPPER-2026-HARD-9X7!';const HMAC_KEY='SSFA-HMAC-KEY-V15-3-!@#';async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');}async function hashSecure(s){return (await sha256(s+PEPPER)).slice(0,16).toUpperCase();}async function hmac(d){return await sha256(d+HMAC_KEY+PEPPER);}async function signSecure(id){const h1=await sha256(id+'JUBA-S1-'+PEPPER);const h2=await sha256(id+'JUBA-S2-'+PEPPER+h1);return {s1:h1.slice(0,8).toUpperCase(),s2:h2.slice(0,8).toUpperCase()};}
async function secureGet(k){let raw=localStorage.getItem(k);if(!raw)return null;try{let o=JSON.parse(raw);let calc=await hmac(JSON.stringify(o.d));if(calc!==o.h)return null;return o.d;}catch(e){return null;}}async function secureSet(k,data){let sig=await hmac(JSON.stringify(data));localStorage.setItem(k,JSON.stringify({d:data,h:sig}));}
let admins=[],tickets=[],cur=null,lastChecked=null;
async function load(){let a=await secureGet('juba_admins_v15_3_secure');admins=a||[];let t=await secureGet('juba_tickets_v15_3_secure');tickets=t||[];}
(async()=>{await load();let sess=JSON.parse(sessionStorage.getItem('session_gate_v15_3')||'null');if(sess&&Date.now()<sess.exp){let ad=admins.find(x=>x.u===sess.u);if(ad){cur=ad;document.getElementById('loginBox').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=ad.u+' ('+ad.branch+')';renderStats();}}}})();
async function doLogin(){let u=document.getElementById('lu').value.trim().toLowerCase(),p=document.getElementById('lp').value;let hp=await hashSecure(p+PEPPER);let a=admins.find(x=>x.u.toLowerCase()===u&&x.p===hp);if(!a){document.getElementById('lmsg').textContent='Invalid';return;}cur=a;sessionStorage.setItem('session_gate_v15_3',JSON.stringify({u:a.u,exp:Date.now()+12*60*60*1000}));document.getElementById('loginBox').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=a.u+' ('+a.branch+')';renderStats();}
function logout(){sessionStorage.removeItem('session_gate_v15_3');location.reload();}
async function check(){let id=document.getElementById('scanId').value.trim().toUpperCase().replace(/[^A-Z0-9\-]/g,'');if(id.length<5){document.getElementById('result').innerHTML='';return;}let t=tickets.find(x=>x.id===id||x.id.endsWith(id.slice(-8)));let res=document.getElementById('result');let btn=document.getElementById('allowBtn');if(!t){res.innerHTML='<div class=invalid>❌ NOT FOUND<br><small>Ticket not in system</small></div>';btn.classList.add('hidden');lastChecked=null;return;}let sigs=await signSecure(t.id);if(sigs.s1!==t.sig||sigs.s2!==t.sig2){res.innerHTML='<div class=invalid>❌ FORGED TICKET<br><small>Signature mismatch - FAKE!</small></div>';btn.classList.add('hidden');lastChecked=null;return;}if(t.cancelled){res.innerHTML='<div class=invalid>❌ CANCELLED<br><small>By '+t.cancelledBy+'</small></div>';btn.classList.add('hidden');lastChecked=null;return;}if(t.used){res.innerHTML='<div class=invalid>❌ ALREADY USED<br><small>Used at '+new Date(t.usedAt).toLocaleString()+'<br>Gate: '+t.usedGate+'</small></div>';btn.classList.add('hidden');lastChecked=null;return;}lastChecked=t;res.innerHTML='<div class=valid>✅ VALID TICKET<br><b>'+t.fan+'</b><br>'+t.tier.toUpperCase()+' - '+t.num+' seat(s)<br>'+t.seats.join(', ')+'<br>Match: '+t.match.teamA+' vs '+t.match.teamB+'<br>ID: '+t.id.slice(-12)+'</div>';btn.classList.remove('hidden');}
async function allow(){if(!lastChecked)return;let idx=tickets.findIndex(x=>x.id===lastChecked.id);if(idx<0)return;tickets[idx].used=true;tickets[idx].usedAt=new Date().toISOString();tickets[idx].usedGate=cur.u+'/'+cur.branch;await secureSet('juba_tickets_v15_3_secure',tickets);document.getElementById('result').innerHTML='<div class=valid>✅ ENTRY ALLOWED<br>Welcome '+tickets[idx].fan+'</div>';document.getElementById('allowBtn').classList.add('hidden');document.getElementById('scanId').value='';lastChecked=null;renderStats();}
async function renderStats(){await load();let today=new Date().toDateString();let usedToday=tickets.filter(x=>x.used&&new Date(x.usedAt).toDateString()===today);let valid=tickets.filter(x=>!x.cancelled&&!x.used);document.getElementById('stats').innerHTML='Total Tickets: '+tickets.filter(x=>!x.cancelled).length+'<br>Valid (not used): '+valid.length+'<br>Used Today: '+usedToday.length+'<br>Cancelled: '+tickets.filter(x=>x.cancelled).length;}
</script></body></html>
