<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GATE - Juba Stadium</title><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{background:#070b1a;color:#fff;font-family:system-ui;text-align:center;padding:16px}.card{background:#111b3d;padding:16px;border-radius:16px;max-width:500px;margin:auto}#reader{width:100%;border-radius:12px;overflow:hidden;border:2px solid #FFD700}</style></head><body><div class="card"><h2>🏟️ بوابة استاد جوبا</h2><p style="color:#8aa0d0;font-size:12px">افحص تذكرة QR</p><div id="reader"></div><div id="result" style="margin-top:14px;font-weight:900;font-size:18px"></div></div><script>
const firebaseConfig={apiKey:"AIzaSyB65erIbKPojeJCtvWCaUPNBqA_YQ6QGJ0",authDomain:"juba-stadium-1ace0.firebaseapp.com",projectId:"juba-stadium-1ace0",storageBucket:"juba-stadium-1ace0.firebasestorage.app",messagingSenderId:"299347484908",appId:"1:299347484908:web:926e359973c26aa1f0c5c9"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function onScan(id){db.collection('juba_tickets').doc(id.trim()).get().then(doc=>{const r=document.getElementById('result');if(!doc.exists){r.innerHTML='❌ تذكرة غير موجودة';r.style.color='#ff6b7a';return;}const d=doc.data();if(d.used){r.innerHTML='⚠️ مستخدمة مسبقاً<br>'+d.fanName+'<br>'+d.team1+' vs '+d.team2;r.style.color='#ffaa00';return;}db.collection('juba_tickets').doc(id.trim()).update({used:true,usedAt:Date.now()});r.innerHTML=`✅ مقبولة<br>${d.team1} vs ${d.team2}<br>${d.grade}<br>👤 ${d.fanName}`;r.style.color='#00ff88';});}
const html5QrCode=new Html5Qrcode("reader");html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},onScan);
</script></body></html>
