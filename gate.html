<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate Check - JUBA STADIUM V16.1</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#070b1a;--card:#111b3d;--text:#eaf0ff;--muted:#8aa0d0}
[data-theme="light"]{--bg:#f4f6ff;--card:#fff;--text:#0a1430;--muted:#5a6a90}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Tajawal}
body{background:var(--bg);color:var(--text);transition:.3s}
header{background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff15}
.card{background:var(--card);border:1px solid #ffffff12;border-radius:16px;padding:16px;margin:12px auto;max-width:520px}
.btn{background:#2d6bff;color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:800}
.btn.ghost{background:transparent;border:1px solid #ffffff25;color:var(--text)}
.gold-text{background:linear-gradient(90deg,#FFD700,#FFA500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.hidden{display:none}
.call-btn{display:inline-flex;gap:6px;background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;padding:8px 14px;border-radius:20px;font-weight:900;font-size:12px;text-decoration:none;cursor:pointer}
#loginOverlay{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}
.login-box{max-width:380px;width:100%;background:var(--card);padding:24px;border-radius:20px;border:1px solid #ffffff15;text-align:center}
</style>
</head>
<body>
<header>
<div style="font-weight:900">🏟️ GATE CHECK</div>
<div><button class="btn ghost small" id="themeBtn">🌙</button> <button class="btn ghost small" id="langBtn">EN</button></div>
</header>

<div id="loginOverlay">
<div class="login-box">
<h2 id="loginTitle">دخول البوابة / Gate Login</h2>
<input id="gateId" placeholder="ID"><input id="gatePass" type="password" placeholder="Password">
<button class="btn" id="loginBtn" style="width:100%;margin-top:8px">دخول / Login</button>
<p id="loginMsg" style="color:#ff6b7a;font-size:12px;margin-top:8px"></p>
<a class="call-btn" id="callITBtn">📞 Call our IT team</a>
<p id="phoneReveal" class="hidden" style="margin-top:8px"><a href="tel:0928813308" style="color:#FFD700;font-weight:900;text-decoration:none">0928813308 - اضغط للاتصال</a></p>
</div>
</div>

<div class="card">
<h3 id="scanTitle">فحص التذاكر - امسح الـ QR</h3>
<div id="reader" style="width:100%;border-radius:12px;overflow:hidden"></div>
<div id="result" style="margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);min-height:60px"></div>
<button class="btn ghost" id="resetBtn" style="width:100%;margin-top:10px">فحص تذكرة جديدة / Scan New</button>
<p class="gold-text" style="text-align:center;margin-top:12px">Call our team 0928813308</p>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyDbPsfTygtodq8THsbSNZ4y2UTO0qHgr_4",authDomain:"ssnps-police-app-7018f.firebaseapp.com",projectId:"ssnps-police-app-7018f",storageBucket:"ssnps-police-app-7018f.firebasestorage.app",messagingSenderId:"705275454318",appId:"1:705275454318:web:a3cb76139563b6c33d977f"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const esc=s=> (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let lang='ar', logged=false, scanner=null;

document.getElementById('themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme',cur==='light'?'dark':'light');};
document.getElementById('langBtn').onclick=()=>{
 lang=lang==='ar'?'en':'ar'; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.getElementById('loginTitle').textContent=lang==='ar'?'دخول البوابة':'Gate Login';
 document.getElementById('scanTitle').textContent=lang==='ar'?'فحص التذاكر - امسح الـ QR':'Scan Ticket QR';
 document.getElementById('langBtn').textContent=lang==='ar'?'EN':'عربي';
};
document.getElementById('callITBtn').onclick=(e)=>{
 e.preventDefault();
 document.getElementById('phoneReveal').classList.toggle('hidden');
 window.location.href='tel:0928813308';
};
document.getElementById('loginBtn').onclick=()=>{
 const id=document.getElementById('gateId').value.trim(); const pass=document.getElementById('gatePass').value.trim();
 if((id==='GATE'&&pass==='Gate@2026')||(id==='ADMIN'&&pass==='Juba@2026')){
  logged=true; document.getElementById('loginOverlay').style.display='none'; startScanner();
 } else document.getElementById('loginMsg').textContent='خطأ / Wrong';
};

function startScanner(){
 if(scanner) return;
 scanner=new Html5QrcodeScanner("reader",{fps:10,qrbox:250});
 scanner.render(onScanSuccess);
}
function onScanSuccess(text){
 if(!logged) return;
 db.collection('juba_tickets').doc(text).get().then(doc=>{
  if(!doc.exists){document.getElementById('result').innerHTML='<b style="color:#ff3b5c">❌ تذكرة غير موجودة / Invalid Ticket<br>'+esc(text)+'</b>'; return;}
  const t=doc.data();
  if(t.used){document.getElementById('result').innerHTML='<b style="color:orange">⚠️ مستخدمة من قبل / Already Used<br>'+esc(t.fanName)+' - '+esc(t.grade)+' - '+esc(t.team1)+' vs '+esc(t.team2)+'</b>'; return;}
  document.getElementById('result').innerHTML='<b style="color:#00ff88">✅ صالحة / VALID<br>'+esc(t.team1)+' vs '+esc(t.team2)+'<br>'+esc(t.competition)+' - '+esc(t.grade)+'<br>المشجع: '+esc(t.fanName)+' - '+esc(t.fanPhone)+'</b>';
  db.collection('juba_tickets').doc(text).update({used:true,usedAt:Date.now(),checkedBy:'GATE'});
 });
}
document.getElementById('resetBtn').onclick=()=>{document.getElementById('result').innerHTML='';};
</script>
</body>
                                                                                                                                                                             </html>
