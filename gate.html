<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الدخول - Juba Stadium</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
<div class="max-w-md mx-auto">
<h1 class="text-xl font-bold text-center mb-4">🚪 بوابة فحص التذاكر V18</h1>

<div class="bg-gray-800 p-4 rounded-2xl mb-4">
<div id="reader" class="rounded overflow-hidden"></div>
<p class="text-xs text-center text-gray-400 mt-2">وجه الكاميرا على QR</p>
</div>

<div class="bg-gray-800 p-4 rounded mb-4">
<label class="text-sm">أو اكتب كود التذكرة يدوياً</label>
<div class="flex gap-2 mt-2">
<input id="manualCode" class="flex-1 p-3 rounded bg-gray-700 text-left" dir="ltr" placeholder="Ticket ID">
<button onclick="checkTicket(document.getElementById('manualCode').value)" class="bg-blue-600 px-4 rounded font-bold">فحص</button>
</div>
</div>

<div id="result" class="hidden p-4 rounded-2xl text-center"></div>

<div id="log" class="mt-6 bg-gray-800 p-3 rounded text-xs">
<h3 class="font-bold mb-2">سجل اليوم</h3>
<div id="logList" class="space-y-1"></div>
<p class="mt-2">إجمالي الداخلين: <b id="countIn">0</b></p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ========= نفس الـ CONFIG بتاع index.html الصقو هنا =========
const firebaseConfig = {
  apiKey: "ضع نفس الـ apiKey العملتو في index.html",
  authDomain: "juba-stadium-xxx.firebaseapp.com",
  projectId: "juba-stadium-xxx",
  storageBucket: "juba-stadium-xxx.appspot.com",
  messagingSenderId: "xxx",
  appId: "1:xxx:web:xxx"
};
// ============================================================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let todayCount = 0;

async function checkTicket(ticketId){
  if(!ticketId) return;
  const resultDiv = document.getElementById('result');
  resultDiv.classList.remove('hidden');
  resultDiv.className = 'p-4 rounded-2xl text-center bg-yellow-900/50';
  resultDiv.innerHTML = 'جاري الفحص... ⏳';
  
  try{
    let snap = await getDoc(doc(db,'juba_tickets',ticketId.trim()));
    if(!snap.exists()){
      resultDiv.className = 'p-4 rounded-2xl text-center bg-red-900';
      resultDiv.innerHTML = `❌ تذكرة غير موجودة<br><small>${ticketId}</small>`;
      return;
    }
    let t = snap.data();
    if(t.used){
      resultDiv.className = 'p-4 rounded-2xl text-center bg-red-900';
      resultDiv.innerHTML = `⛔ مستخدمة مسبقاً<br><b>${t.buyerName}</b> - ${t.grade}<br><small>دخل: ${t.usedAt?.toDate ? t.usedAt.toDate().toLocaleString() : 'قبل'}</small><br><small>قطعها: ${t.soldByName||t.soldBy}</small>`;
      return;
    }
    // صالحة - اعملها مستخدمة
    await updateDoc(doc(db,'juba_tickets',ticketId.trim()),{used:true, usedAt:serverTimestamp()});
    resultDiv.className = 'p-4 rounded-2xl text-center bg-green-600';
    resultDiv.innerHTML = `✅ دخول مسموح<br><b class="text-xl">${t.buyerName}</b><br>${t.grade.toUpperCase()} - ${t.price} SDG<br><small class="text-gray-200">قطعها الموظف: ${t.soldByName||t.soldBy}</small><br><small>${ticketId}</small>`;
    
    // سجل
    todayCount++;
    document.getElementById('countIn').textContent = todayCount;
    document.getElementById('logList').innerHTML = `<div class="bg-gray-700 p-2 rounded flex justify-between"><span>${t.buyerName} (${t.grade})</span><span class="text-green-400">${t.soldByName||t.soldBy}</span></div>` + document.getElementById('logList').innerHTML;
    
  }catch(e){
    resultDiv.className = 'p-4 rounded-2xl text-center bg-red-900';
    resultDiv.innerHTML = 'خطأ: '+e.message;
  }
}
window.checkTicket = checkTicket;

// QR Scanner
const html5QrCode = new Html5Qrcode("reader");
html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
  (decoded)=>{ document.getElementById('manualCode').value=decoded; checkTicket(decoded); },
  ()=>{}
).catch(err=>console.log(err));
</script>
</body>
</html>
